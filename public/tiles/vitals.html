<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vitals</title>
<style>
  /* Vitality reskin of the Patron "Recovery" tile — sealed & bridge-backed.
     Recovery ring + sleep ring, readiness status, trend chart and tips, all
     from a manual daily vitals entry. No external assets and no browser
     storage; history persists through the dashboard bridge (window.Vitality). */
  :root{
    --bg:#050506;--surface:#0e0e11;--border:#1d1d22;--brand:#6EE7B7;
    --brand-soft:rgba(110,231,183,.08);--brand-line:rgba(110,231,183,.35);
    --muted:#84848c;--muted-strong:#a8a8b0;--fg:#ededf0;
    --pos:#6EE7B7;--warn:#f5c451;--neg:#ff6b6b;--track:#17171b;
    --radius-md:12px;--radius-lg:16px;--radius-pill:999px;
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace;
    --duration:.2s;--ease:cubic-bezier(.2,.8,.2,1);--ease-premium:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-display);display:flex;justify-content:center;padding:40px 20px}
  .shell{width:100%;max-width:640px}
  .header{margin-bottom:22px}
  .title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0}
  .subtitle{color:var(--muted);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0}
  .card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:18px;margin-bottom:14px}
  .cardName{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:14px}

  /* entry form */
  .entryGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
  @media(max-width:560px){.entryGrid{grid-template-columns:repeat(2,1fr)}}
  .field{display:flex;flex-direction:column;gap:6px}
  .fLabel{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fieldInput{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;width:100%}
  .fieldInput:focus{outline:none;border-color:var(--brand)}
  .hint{color:var(--muted);font-size:12px;font-family:var(--font-mono);min-height:14px;margin-top:10px}

  /* hero rings */
  .hero{display:flex;align-items:center;justify-content:center;gap:34px;flex-wrap:wrap;text-align:center}
  .recRing{position:relative;width:150px;height:150px;display:grid;place-items:center;flex-shrink:0;overflow:visible}
  .recRing[data-tone="good"]{color:var(--pos)}.recRing[data-tone="watch"]{color:var(--warn)}.recRing[data-tone="low"]{color:var(--neg)}.recRing[data-tone="muted"]{color:var(--muted)}
  .recRing::before{content:'';position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(closest-side,currentColor,transparent 70%);opacity:.28;filter:blur(14px);pointer-events:none;z-index:0;animation:recPulse 3.6s var(--ease) infinite}
  .recRing[data-tone="muted"]::before{opacity:.08;animation:none}
  @keyframes recPulse{0%,100%{opacity:.22}50%{opacity:.4}}
  .recRing svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible;z-index:1}
  .recTrack{fill:none;stroke:var(--track);stroke-width:10}
  .recFill{fill:none;stroke:currentColor;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 800ms var(--ease-premium);filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 11px currentColor)}
  .ringWrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .ringSub{font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--fg)}
  .recInner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:120px}
  .recNum{color:var(--fg);font-weight:700;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
  .recNum small{font-size:.95rem;color:var(--muted-strong)}
  .recCap{font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px;text-align:center;white-space:nowrap}
  .statusBlock{text-align:center;margin-top:18px}
  .statusWord{font-weight:700;font-size:1.25rem}
  .statusWord[data-tone="good"]{color:var(--pos)}.statusWord[data-tone="watch"]{color:var(--warn)}.statusWord[data-tone="low"]{color:var(--neg)}.statusWord[data-tone="muted"]{color:var(--muted-strong)}
  .statusLine{font-size:14px;color:var(--muted-strong);line-height:1.5;margin-top:6px;max-width:44ch;margin-left:auto;margin-right:auto}

  /* stat chips */
  .statRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .stat{flex:1;min-width:96px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px}
  .statLabel{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .statVal{font-weight:700;font-size:1.15rem;margin-top:4px;font-variant-numeric:tabular-nums}
  .statVal small{font-size:11px;color:var(--muted);font-weight:400}

  /* chart */
  .chartHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px;gap:2px}
  .segBtn{appearance:none;background:transparent;border:0;color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;padding:5px 11px;border-radius:var(--radius-pill);cursor:pointer}
  .segBtn.on{background:var(--brand-soft);color:var(--brand)}
  .chart{width:100%;height:130px;display:block;overflow:visible;margin-top:12px}
  .legend{display:flex;gap:16px;margin-top:8px}
  .legItem{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .legDot{width:12px;height:3px;border-radius:2px}
  .noteLine{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px;line-height:1.5}

  /* draggable card wrappers — a sheet-handle grip centered at each card's top */
  .cardWrap{position:relative}
  .cardGrip{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;background:none;border:none;color:var(--muted);opacity:.45;font-size:13px;letter-spacing:2px;line-height:1;padding:6px 18px;cursor:grab;touch-action:none}
  .cardGrip:hover{opacity:1;color:var(--fg)}
  .cardGrip:active{cursor:grabbing}

  /* entry date navigator — makes every day's vitals editable */
  .dateNav{display:flex;align-items:center;gap:6px}
  .dnBtn{appearance:none;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:8px;width:28px;height:28px;font-size:16px;line-height:1;cursor:pointer}
  .dnBtn:hover:not(:disabled){color:var(--fg);border-color:var(--muted)}
  .dnBtn:disabled{opacity:.35;cursor:default}
  .dnDate{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;color-scheme:dark}

  /* chart tooltips */
  #chartTip{position:fixed;z-index:99;display:none;pointer-events:none;background:#101014;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;color:var(--fg);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .chart .tipHit{cursor:pointer}

  /* trends chart tabs — click through the metric graphs */
  .chartTabs{display:flex;gap:5px;margin:4px 0 12px;flex-wrap:wrap}
  .ctab{appearance:none;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:var(--radius-pill);padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .ctab:hover{color:var(--fg)}
  .ctab.on{background:rgba(110,231,183,.1);border-color:#6EE7B7;color:#6EE7B7}

  /* feel check-in buttons */
  .feelRow{display:flex;gap:8px}
  .feelBtn{flex:1;padding:12px 6px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s,background .15s,transform .15s}
  .feelBtn:hover{transform:translateY(-1px)}
  .feelBtn:nth-child(1).on{border-color:#e06a6c;color:#e06a6c;background:rgba(224,106,108,.09)}
  .feelBtn:nth-child(2).on{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.09)}
  .feelBtn:nth-child(3).on{border-color:#6EE7B7;color:#6EE7B7;background:rgba(110,231,183,.09)}
  .feelBtn:nth-child(4).on{border-color:#a7f3d0;color:#a7f3d0;background:rgba(167,243,208,.12);box-shadow:0 0 14px rgba(167,243,208,.25)}

  /* tips */
  .tip{display:flex;gap:12px;padding:13px 14px;border-radius:var(--radius-md);background:var(--bg);border:1px solid var(--border);margin-bottom:10px}
  .tip:last-child{margin-bottom:0}
  .tipIcon{font-size:18px;flex-shrink:0;line-height:1.4}
  .tipText{font-size:13.5px;line-height:1.5;color:var(--muted-strong)}
  .tipText b{color:var(--fg)}
  @media (prefers-reduced-motion:reduce){.recRing::before{animation:none}.recFill{transition:none}}
</style>
</head>
<body>
<main><div class="shell" id="app"></div></main>
<script>
/* Vitals — daily recovery & sleep tracker. Ported from the Patron "Recovery"
   standalone: reskinned to Vitality mint, sealed (no external assets), and
   persisting through the dashboard bridge (window.Vitality) instead of
   browser storage. In the suite the source read a shared health record; the
   sealed tile takes a manual daily entry (HRV / RHR / sleep) and feeds the
   same recovery-estimate math, rings, trend chart and readiness tips. */
let store={};     /* keyed by YYYY-MM-DD -> {hrv,rhr,sleepHours,sleepPerf,feel:1-4} */
let range=14;
let chartTab='trend'; /* which trends tab is showing: trend|hrv|rhr|sleep|corr */
let editDate=null;    /* which day the entry card edits (null until boot = today) */
const $=id=>document.getElementById(id);
const round=n=>Math.round(n);
const clamp01=x=>Math.max(0,Math.min(1,x));
function persist(){window.Vitality.save(store).catch(()=>{});} /* host may reject (quota); tile state stays live */
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function num(v){const n=Number(v);return (v===''||v==null||!isFinite(n))?null:n;}
function todaysEntry(){return store[todayKey()]||{};}
function editedEntry(){return store[editDate||todayKey()]||{};}
function shiftEditDate(days){
  const [y,m,d]=(editDate||todayKey()).split('-').map(Number);
  const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+days);
  const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(k>todayKey()) return; /* the future isn't editable */
  editDate=k;
}
function fmtEditDate(){
  const k=editDate||todayKey();
  if(k===todayKey()) return 'Today';
  const [y,m,d]=k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

/* subjective "how do you feel" rating (1 bad … 4 excellent). It nudges
   today's sleep score and joins the recovery blend as its own component —
   the body knows things the band doesn't. */
const FEELS=['','Bad','Okay','Good','Excellent'];
const FEEL_COLOR=['','#e06a6c','#f59e0b','#6EE7B7','#a7f3d0'];
const FEEL_REC={1:20,2:50,3:75,4:95};       /* recovery-component value */
const FEEL_SLEEP_ADJ={1:-10,2:0,3:4,4:8};   /* sleep-score nudge */
function adjSleepPerf(h){
  const p=num(h&&h.sleepPerf); if(p==null) return null;
  const a=(h&&typeof h.feel==='number')?(FEEL_SLEEP_ADJ[h.feel]||0):0;
  return Math.max(1,Math.min(100,Math.round(p+a)));
}

/* recovery estimate — same weighting as the source dashboard, plus feel */
function estRecovery(h){
  if(!h) return null;
  const parts=[],w=[];
  if(typeof h.hrv==='number'){ parts.push(clamp01((h.hrv-20)/(90-20))*100); w.push(0.5); }
  if(typeof h.rhr==='number'){ parts.push(clamp01((80-h.rhr)/(80-42))*100); w.push(0.25); }
  const sp=adjSleepPerf(h);
  if(sp!=null){ parts.push(sp); w.push(0.25); }
  else if(typeof h.sleepHours==='number'){ parts.push(clamp01(h.sleepHours/8)*100); w.push(0.25); }
  if(typeof h.feel==='number'){ parts.push(FEEL_REC[h.feel]??50); w.push(0.3); }
  if(!parts.length) return null;
  const sw=w.reduce((a,b)=>a+b,0); let s=0; for(let i=0;i<parts.length;i++)s+=parts[i]*w[i];
  return Math.max(1,Math.min(99,Math.round(s/sw)));
}
function tone(r){ if(r==null)return 'muted'; if(r>=67)return 'good'; if(r>=34)return 'watch'; return 'low'; }
function sleepTone(p){ if(p==null)return 'muted'; if(p>=85)return 'good'; if(p>=60)return 'watch'; return 'low'; }
function fmtHM(h){ if(h==null)return '—'; const hh=Math.floor(h),mm=Math.round((h-hh)*60); return hh+'h '+String(mm).padStart(2,'0')+'m'; }

/* every dated entry, oldest -> newest, with derived recovery */
function entries(){
  return Object.keys(store).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().map(k=>{
    const e=store[k]||{};
    return {dateKey:k,hrv:num(e.hrv),rhr:num(e.rhr),sleepHours:num(e.sleepHours),sleepPerf:num(e.sleepPerf),feel:(typeof e.feel==='number'?e.feel:null),weight:num(e.weight),recovery:estRecovery(e)};
  });
}

function ringWrap(value,toneStr,cap,sub){
  const circ=2*Math.PI*64;
  const ring='<div class="recRing" data-tone="'+toneStr+'"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="64" class="recTrack"/>'
    +(value!=null?'<circle cx="75" cy="75" r="64" class="recFill" style="stroke-dasharray:'+circ+';stroke-dashoffset:'+(circ*(1-value/100))+'"/>':'')
    +'</svg><div class="recInner"><div class="recNum">'+(value!=null?Math.round(value):'—')+(value!=null?'<small>%</small>':'')+'</div><div class="recCap">'+cap+'</div></div></div>';
  return '<div class="ringWrap">'+ring+(sub?'<div class="ringSub">'+sub+'</div>':'')+'</div>';
}

/* ---------- trend chart ---------- */
function chartSvg(){
  const hist=entries().slice(-range);
  if(hist.length<2) return '<p class="noteLine">Trends appear once you have 2+ days of vitals — check in daily and the chart fills in.</p>';
  const W=320,H=120,padY=10;
  const recs=hist.map(d=>typeof d.recovery==='number'?d.recovery:null);
  const sleeps=hist.map(d=>typeof d.sleepHours==='number'?d.sleepHours:null);
  const maxSleep=Math.max(9,...sleeps.filter(v=>v!=null));
  const xOf=i=>hist.length===1?W/2:(i/(hist.length-1))*W;
  const yRec=v=>H-padY-(v/100)*(H-padY*2);
  const ySleep=v=>H-padY-(v/maxSleep)*(H-padY*2);
  let bars='';
  const bw=Math.max(4,(W/hist.length)*0.5);
  hist.forEach((d,i)=>{ if(typeof d.sleepHours==='number'){ const x=xOf(i)-bw/2,y=ySleep(d.sleepHours); bars+='<rect class="tipHit" data-tip="'+esc2(fmtTipDate(d.dateKey)+' · Sleep '+fmtHM(d.sleepHours))+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-padY-y).toFixed(1)+'" rx="2" fill="#84848c" opacity=".30"/>'; } });
  const pts=[]; recs.forEach((v,i)=>{ if(v!=null)pts.push([xOf(i),yRec(v),v,hist[i].dateKey]); });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>tipDot(p[0].toFixed(1),p[1].toFixed(1),2.6,'#6EE7B7',fmtTipDate(p[3])+' · Recovery '+Math.round(p[2])+'%')).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    + bars
    + (pts.length>1?'<path d="'+line+'" fill="none" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px rgba(110,231,183,.6))"/>':'')
    + dots + '</svg>'
    + '<div class="legend"><span class="legItem"><span class="legDot" style="background:#6EE7B7"></span>Recovery %</span><span class="legItem"><span class="legDot" style="background:#84848c"></span>Sleep hours</span></div>';
}

/* ---------- chart tooltips (hover / tap a plot point) ---------- */
function fmtTipDate(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
/* a visible dot + an invisible, larger hit circle carrying the tooltip text */
function tipDot(x,y,r,fill,tip,extra){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'"'+(extra||'')+'/>'
       + '<circle class="tipHit" cx="'+x+'" cy="'+y+'" r="10" fill="transparent" data-tip="'+esc2(tip)+'"/>';
}
function esc2(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function tipEl(){ let t=$('chartTip'); if(!t){ t=document.createElement('div'); t.id='chartTip'; document.body.appendChild(t); } return t; }
function moveTip(e){ const t=tipEl(); const pad=12;
  let x=e.clientX+pad, y=e.clientY-34;
  const w=t.offsetWidth||120;
  if(x+w>window.innerWidth-8) x=e.clientX-w-pad;
  if(y<8) y=e.clientY+18;
  t.style.left=x+'px'; t.style.top=y+'px';
}
document.addEventListener('pointerover',e=>{
  const h=e.target.closest && e.target.closest('.tipHit');
  if(!h) return;
  const t=tipEl(); t.textContent=h.getAttribute('data-tip'); t.style.display='block'; moveTip(e);
});
document.addEventListener('pointermove',e=>{
  const t=$('chartTip'); if(!t||t.style.display!=='block') return;
  if(e.target.closest && e.target.closest('.tipHit')) moveTip(e);
  else t.style.display='none';
});
document.addEventListener('pointerout',e=>{
  if(e.target.closest && e.target.closest('.tipHit')){
    const rel=e.relatedTarget;
    if(!(rel&&rel.closest&&rel.closest('.tipHit'))){ const t=$('chartTip'); if(t) t.style.display='none'; }
  }
});

/* ---------- metric charts + the correlation finder ---------- */
const CHART_TABS=[['trend','Overview'],['hrv','HRV'],['rhr','Resting HR'],['sleep','Sleep'],['weight','Weight'],['corr','Correlation']];

/* one metric over the range: line + dots + latest/range caption */
function metricChart(key,color,unit,fmt){
  const hist=entries().slice(-range);
  const f=fmt||(v=>Math.round(v*10)/10);
  const pts=hist.map((d,i)=>({i,v:typeof d[key]==='number'?d[key]:null,dk:d.dateKey})).filter(p=>p.v!=null);
  if(pts.length<2) return '<p class="noteLine">Not enough '+unit+' data in this window yet — it charts once 2+ days have values.</p>';
  const W=320,H=120,padY=14,padX=6;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi-lo<1e-9){ hi+=1; lo-=1; }
  const span=hi-lo; lo-=span*0.12; hi+=span*0.12;
  const xOf=i=>hist.length===1?W/2:padX+(i/(hist.length-1))*(W-padX*2);
  const yOf=v=>H-padY-((v-lo)/(hi-lo))*(H-padY*2);
  const line=pts.map((p,k)=>(k?'L':'M')+xOf(p.i).toFixed(1)+' '+yOf(p.v).toFixed(1)).join(' ');
  const dots=pts.map(p=>tipDot(xOf(p.i).toFixed(1),yOf(p.v).toFixed(1),2.8,color,fmtTipDate(p.dk)+' · '+f(p.v)+' '+unit)).join('');
  const latest=pts[pts.length-1].v;
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    + '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px '+color+'88)"/>'
    + dots + '</svg>'
    + '<div class="legend"><span class="legItem"><span class="legDot" style="background:'+color+'"></span>Latest '+f(latest)+' '+unit+'</span>'
    + '<span class="legItem" style="color:var(--muted)">range '+f(Math.min(...vals))+'–'+f(Math.max(...vals))+' '+unit+'</span></div>';
}

/* Pearson r over paired days */
function pearson(pairs){
  const n=pairs.length;
  const mx=pairs.reduce((s,p)=>s+p[0],0)/n, my=pairs.reduce((s,p)=>s+p[1],0)/n;
  let sxy=0,sx=0,sy=0;
  pairs.forEach(([x,y])=>{ sxy+=(x-mx)*(y-my); sx+=(x-mx)**2; sy+=(y-my)**2; });
  if(sx===0||sy===0) return null;
  return { r:sxy/Math.sqrt(sx*sy), mx, my, slope:sxy/sx };
}

/* the pairs worth testing (derived metrics like recovery excluded — they'd
   trivially correlate with their own inputs) */
const CORR_PAIRS=[
  ['sleepHours','hrv','Sleep (h)','HRV (ms)'],
  ['sleepHours','rhr','Sleep (h)','Resting HR'],
  ['sleepPerf','hrv','Sleep score','HRV (ms)'],
  ['hrv','rhr','HRV (ms)','Resting HR'],
  ['feel','hrv','Feel (1–4)','HRV (ms)'],
  ['feel','sleepHours','Feel (1–4)','Sleep (h)'],
];
function corrChart(){
  const hist=entries().slice(-Math.max(range,30)); /* correlations need bodies of data */
  let best=null;
  CORR_PAIRS.forEach(([a,b,la,lb])=>{
    const pairs=hist.filter(d=>typeof d[a]==='number'&&typeof d[b]==='number').map(d=>[d[a],d[b],d.dateKey]);
    if(pairs.length<5) return;
    const p=pearson(pairs);
    if(p && (!best || Math.abs(p.r)>Math.abs(best.r))) best={...p, a, b, la, lb, pairs};
  });
  if(!best) return '<p class="noteLine">Correlations unlock at 5+ days where two metrics both have values — keep checking in.</p>';
  const W=320,H=140,pad=16;
  const xs=best.pairs.map(p=>p[0]), ys=best.pairs.map(p=>p[1]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(x1-x0<1e-9){x1+=1;x0-=1;} if(y1-y0<1e-9){y1+=1;y0-=1;}
  const X=v=>pad+((v-x0)/(x1-x0))*(W-pad*2);
  const Y=v=>H-pad-((v-y0)/(y1-y0))*(H-pad*2);
  const dots=best.pairs.map(p=>tipDot(X(p[0]).toFixed(1),Y(p[1]).toFixed(1),3.2,'#6EE7B7',
    fmtTipDate(p[2])+' · '+best.la+' '+(Math.round(p[0]*10)/10)+' · '+best.lb+' '+(Math.round(p[1]*10)/10),' opacity=".85"')).join('');
  /* least-squares line through the cloud */
  const yAt=x=>best.my+best.slope*(x-best.mx);
  const fit='<line x1="'+X(x0).toFixed(1)+'" y1="'+Y(yAt(x0)).toFixed(1)+'" x2="'+X(x1).toFixed(1)+'" y2="'+Y(yAt(x1)).toFixed(1)+'" stroke="rgba(255,255,255,.4)" stroke-width="1.6" stroke-dasharray="5 4"/>';
  const s=Math.abs(best.r);
  const strength=s>=0.6?'strong':s>=0.3?'moderate':'weak';
  const dir=best.r>=0?'higher':'lower';
  const caption='<b>'+best.la+' × '+best.lb+'</b> — r = '+(Math.round(best.r*100)/100)
    +' ('+strength+'). More '+best.la.toLowerCase().replace(/\s*\(.*\)/,'')+' &rarr; '+dir+' '+best.lb.toLowerCase().replace(/\s*\(.*\)/,'')
    +', across '+best.pairs.length+' days.';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+fit+dots+'</svg>'
    + '<p class="noteLine" style="font-style:normal">'+caption+'</p>';
}

function chartBody(){
  if(chartTab==='hrv') return metricChart('hrv','#6EE7B7','ms');
  if(chartTab==='rhr') return metricChart('rhr','#e06a6c','bpm',v=>Math.round(v));
  if(chartTab==='sleep') return metricChart('sleepHours','#B794F6','h');
  if(chartTab==='weight') return metricChart('weight','#F5B044','lb');
  if(chartTab==='corr') return corrChart();
  return chartSvg();
}

/* ---------- feel check-in + its history chart ---------- */
function feelHtml(){
  const isToday=(editDate||todayKey())===todayKey();
  const f=editedEntry().feel;
  return '<section class="card"><span class="cardName">'+(isToday?'How do you feel?':'How did you feel — '+fmtEditDate()+'?')+'</span>'
    + '<div class="feelRow">'+[1,2,3,4].map(v=>'<button class="feelBtn'+(f===v?' on':'')+'" data-feel="'+v+'">'+FEELS[v]+'</button>').join('')+'</div>'
    + '<div class="hint">One honest tap a day — it nudges the sleep score and readiness'+(f?' (<b style="color:'+FEEL_COLOR[f]+'">'+FEELS[f].toLowerCase()+'</b>'+(isToday?' today':'')+')':'')+'.</div></section>';
}
function feelChartHtml(){
  const hist=entries().slice(-range).filter(d=>d.feel!=null);
  const all=entries().slice(-range);
  let body;
  if(hist.length<2){
    body='<p class="noteLine">Tap a feeling above for 2+ days and your check-ins chart here.</p>';
  } else {
    const W=320,H=96,padY=12,padX=8;
    const xOf=i=>all.length===1?W/2:padX+(i/(all.length-1))*(W-padX*2);
    const yOf=v=>H-padY-((v-1)/3)*(H-padY*2);
    /* faint guide rows for the four levels */
    let grid=''; for(let v=1;v<=4;v++){ const y=yOf(v); grid+='<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.06)" stroke-width="1"/>'; }
    const pts=[]; all.forEach((d,i)=>{ if(d.feel!=null) pts.push([xOf(i),yOf(d.feel),d.feel,d.dateKey]); });
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const dots=pts.map(p=>tipDot(p[0].toFixed(1),p[1].toFixed(1),3.4,FEEL_COLOR[p[2]],fmtTipDate(p[3])+' · Felt '+FEELS[p[2]].toLowerCase())).join('');
    body='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+grid
      + (pts.length>1?'<path d="'+line+'" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>':'')
      + dots+'</svg>'
      + '<div class="legend">'+[1,2,3,4].map(v=>'<span class="legItem"><span class="legDot" style="background:'+FEEL_COLOR[v]+'"></span>'+FEELS[v]+'</span>').join('')+'</div>';
  }
  return '<section class="card"><span class="cardName">How you\'ve felt</span>'+body+'</section>';
}

/* ---------- tips ---------- */
function tips(rec,h){
  const out=[];
  if(rec!=null){
    if(rec>=67) out.push(['&#9889;','<b>Green light.</b> You\'re primed — good day for a hard session or a PR attempt.']);
    else if(rec>=34) out.push(['&#128993;','<b>Moderate.</b> Train, but keep it smart — quality over max intensity today.']);
    else out.push(['&#128721;','<b>Low recovery.</b> Go easy — light movement, hydration, and protect tonight\'s sleep.']);
  }
  if(h&&typeof h.sleepHours==='number'&&h.sleepHours<7) out.push(['&#128564;','<b>Short sleep ('+fmtHM(h.sleepHours)+').</b> Aim for 7–9h tonight — it\'s the biggest lever on tomorrow\'s recovery.']);
  if(h&&typeof h.hrv==='number'&&h.hrv<35) out.push(['&#128201;','<b>HRV is low ('+Math.round(h.hrv)+'ms).</b> A sign of stress or fatigue — prioritise rest and easy days.']);
  if(h&&typeof h.rhr==='number'&&h.rhr>65) out.push(['&#10084;&#65039;','<b>Resting HR is elevated ('+Math.round(h.rhr)+'bpm).</b> Could be stress, poor sleep, or coming down with something.']);
  if(!out.length) out.push(['&#9989;','Enter today\'s HRV, resting HR or sleep above and your readiness, trends and tips fill in here.']);
  return out;
}

/* ---------- render ---------- */
function entryHtml(){
  const e=editedEntry();
  const isToday=(editDate||todayKey())===todayKey();
  const val=k=>e[k]!=null?e[k]:'';
  const f=(id,label,ph,step)=>'<label class="field"><span class="fLabel">'+label+'</span><input class="fieldInput" id="'+id+'" type="number" min="0" step="'+step+'" inputmode="decimal" placeholder="'+ph+'" value="'+val(id.replace('in-',''))+'" /></label>';
  return '<section class="card"><div class="chartHead" style="margin-bottom:12px"><span class="cardName" style="margin:0">'+(isToday?'Today\'s vitals':'Editing · '+fmtEditDate())+'</span>'
    + '<div class="dateNav">'
    +   '<button class="dnBtn" data-datenav="-1" aria-label="Previous day">&#8249;</button>'
    +   '<input class="dnDate" id="dn-date" type="date" value="'+(editDate||todayKey())+'" max="'+todayKey()+'">'
    +   '<button class="dnBtn" data-datenav="1" aria-label="Next day"'+(isToday?' disabled':'')+'>&#8250;</button>'
    + '</div></div><div class="entryGrid">'
    + f('in-hrv','HRV · ms','—','1')
    + f('in-rhr','Resting HR · bpm','—','1')
    + f('in-sleepHours','Sleep · hours','—','0.1')
    + f('in-sleepPerf','Sleep score · %','—','1')
    + f('in-weight','Weight · lb','—','0.1')
    + '</div><div class="hint" id="hint">'+(isToday
      ? 'Fill in what your band or app shows — recovery is estimated from HRV, resting HR and sleep.'
      : 'Editing a past day — every value (and the feel tap below) writes to '+fmtEditDate()+'. Charts update live.')+'</div></section>';
}
function heroHtml(){
  const h=todaysEntry();
  const rec=estRecovery(h);
  const t=tone(rec);
  const statusWord=t==='good'?'Primed':t==='watch'?'Moderate':t==='low'?'Run down':'Awaiting data';
  const statusLine=rec==null?'Enter your HRV or sleep above to estimate today\'s readiness.'
    : t==='good'?'You\'re well recovered and ready to push.'
    : t==='watch'?'Partially recovered — train smart today.'
    : 'Your body needs rest — keep it light.';
  const recRing=ringWrap(rec,t,'Recovery','');
  const hasSleep=(typeof h.sleepPerf==='number'||typeof h.sleepHours==='number');
  const sp=adjSleepPerf(h);
  const sleepRing=hasSleep
    ? ringWrap(sp,sleepTone(sp),'Sleep',typeof h.sleepHours==='number'?fmtHM(h.sleepHours):'')
    : ringWrap(null,'muted','Sleep','');
  return '<section class="card"><span class="cardName">Today</span>'
    +'<div class="hero">'+recRing+sleepRing+'</div>'
    +'<div class="statusBlock"><div class="statusWord" data-tone="'+t+'">'+statusWord+'</div><p class="statusLine">'+statusLine+'</p></div>'
    +'<div class="statRow">'
    +'<div class="stat"><div class="statLabel">HRV</div><div class="statVal">'+(typeof h.hrv==='number'?Math.round(h.hrv)+'<small> ms</small>':'—')+'</div></div>'
    +'<div class="stat"><div class="statLabel">Resting HR</div><div class="statVal">'+(typeof h.rhr==='number'?Math.round(h.rhr)+'<small> bpm</small>':'—')+'</div></div>'
    +'<div class="stat"><div class="statLabel">Sleep</div><div class="statVal">'+(typeof h.sleepHours==='number'?fmtHM(h.sleepHours):'—')+'</div></div>'
    +'</div></section>';
}
function trendsHtml(){
  return '<section class="card"><div class="chartHead"><span class="cardName" style="margin:0">Trends</span>'
    +'<div class="seg">'+[7,14,30].map(n=>'<button class="segBtn '+(range===n?'on':'')+'" data-range="'+n+'">'+n+'d</button>').join('')+'</div></div>'
    +'<div class="chartTabs">'+CHART_TABS.map(([k,l])=>'<button class="ctab'+(chartTab===k?' on':'')+'" data-charttab="'+k+'">'+l+'</button>').join('')+'</div>'
    + chartBody() + '</section>';
}
function guideHtml(){
  const h=todaysEntry();
  const rec=estRecovery(h);
  return '<section class="card"><span class="cardName">Today\'s guidance</span>'
    + tips(rec,h).map(x=>'<div class="tip"><span class="tipIcon">'+x[0]+'</span><span class="tipText">'+x[1]+'</span></div>').join('')
    +'</section>';
}

/* ---------- draggable card layout ----------
   Every card lives in a [data-card] wrapper with a grip; the order persists in
   the store under _cardOrder (non-date key — entries() date-filters, so the
   data paths never see it). */
const CARD_KEYS=['entry','feel','today','trends','felt','guide'];
function cardHtml(k){
  if(k==='entry') return entryHtml();
  if(k==='feel') return feelHtml();
  if(k==='today') return heroHtml();
  if(k==='trends') return trendsHtml();
  if(k==='felt') return feelChartHtml();
  return guideHtml();
}
function cardOrder(){
  const saved=Array.isArray(store._cardOrder)?store._cardOrder:[];
  const out=[]; const seen={};
  saved.forEach(k=>{ if(CARD_KEYS.includes(k)&&!seen[k]){ out.push(k); seen[k]=1; } });
  CARD_KEYS.forEach(k=>{ if(!seen[k]) out.push(k); });
  return out;
}
function renderOutput(){
  /* refresh every card EXCEPT the entry inputs (typing keeps focus) */
  cardOrder().forEach(k=>{
    if(k==='entry') return;
    const w=document.querySelector('[data-card="'+k+'"] .cardBody');
    if(w) w.innerHTML=cardHtml(k);
  });
}
function render(){
  $('app').innerHTML='<header class="header"><h1 class="title">Vitals</h1><p class="subtitle">readiness · sleep · trends — drag ⠿ to reorder</p></header>'
    + cardOrder().map(k=>'<div class="cardWrap" data-card="'+k+'">'
        +'<button class="cardGrip" data-grip="'+k+'" aria-label="Drag to reorder" title="Drag to reorder">&#10495;</button>'
        +'<div class="cardBody">'+cardHtml(k)+'</div></div>').join('');
}

/* card drag & drop: ghost follows the pointer; hovering another card reorders */
let cardDrag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]');
  if(!g||cardDrag) return;
  e.preventDefault();
  const k=g.getAttribute('data-grip');
  const wrap=document.querySelector('[data-card="'+k+'"]');
  const r=wrap.getBoundingClientRect();
  const ghost=wrap.cloneNode(true);
  ghost.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;z-index:90;pointer-events:none;opacity:.92;transform:scale(1.01);box-shadow:0 18px 50px rgba(0,0,0,.6);';
  document.body.appendChild(ghost);
  wrap.style.opacity='.3';
  cardDrag={k,ghost,wrap,sx:e.clientX,sy:e.clientY,last:null};
});
document.addEventListener('pointermove',e=>{
  const d=cardDrag; if(!d) return;
  d.ghost.style.transform='translate('+(e.clientX-d.sx)+'px,'+(e.clientY-d.sy)+'px) scale(1.01)';
  const under=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.getAttribute&&n.getAttribute('data-card')&&n.getAttribute('data-card')!==d.k);
  const target=under?under.getAttribute('data-card'):null;
  if(target&&target!==d.last){
    d.last=target;
    const cur=cardOrder();
    cur.splice(cur.indexOf(d.k),1);
    cur.splice(cur.indexOf(target),0,d.k);
    store._cardOrder=cur; persist();
    /* re-render and re-dim the dragged card (render rebuilds the DOM) */
    render();
    const w=document.querySelector('[data-card="'+d.k+'"]');
    if(w){ w.style.opacity='.3'; d.wrap=w; }
  }
  if(!target) d.last=null;
});
function endCardDrag(){
  const d=cardDrag; if(!d) return;
  d.ghost.remove();
  const w=document.querySelector('[data-card="'+d.k+'"]');
  if(w) w.style.opacity='';
  cardDrag=null;
}
document.addEventListener('pointerup',endCardDrag);
document.addEventListener('pointercancel',endCardDrag);

/* entry inputs stay mounted (never re-rendered) so focus is preserved */
document.addEventListener('input',e=>{
  if(e.target && e.target.id && e.target.id.indexOf('in-')===0){
    /* start from the existing entry so keys the inputs don't own (feel,
       synced values) survive an edit; writes go to the SELECTED day */
    const k0=editDate||todayKey();
    const e2={...(store[k0]||{})};
    ['hrv','rhr','sleepHours','sleepPerf','weight'].forEach(k=>{const v=num($('in-'+k).value); if(v!=null)e2[k]=v; else delete e2[k];});
    store[k0]=e2;
    persist();
    renderOutput();
  }
  if(e.target && e.target.id==='dn-date'){
    const v=e.target.value;
    if(/^\d{4}-\d{2}-\d{2}$/.test(v) && v<=todayKey()){ editDate=v; render(); }
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-range]');
  if(b){ range=parseInt(b.getAttribute('data-range'),10)||14; renderOutput(); return; }
  const ct=e.target.closest('[data-charttab]');
  if(ct){ chartTab=ct.getAttribute('data-charttab'); renderOutput(); return; }
  const dn=e.target.closest('[data-datenav]');
  if(dn){ shiftEditDate(parseInt(dn.getAttribute('data-datenav'),10)); render(); return; }
  const fb=e.target.closest('[data-feel]');
  if(fb){
    const v=parseInt(fb.getAttribute('data-feel'),10);
    const k0=editDate||todayKey();
    const entry={...(store[k0]||{})};
    if(entry.feel===v) delete entry.feel; else entry.feel=v; /* tap again to clear */
    store[k0]=entry;
    persist();
    renderOutput();
  }
});

(async()=>{const d=await window.Vitality.load();store=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};render();})();
</script>
