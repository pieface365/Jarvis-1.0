<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fuel</title>
<style>
  /* Vitality reskin of the Patron "Macros" tile — sealed & bridge-backed. */
  :root{
    --bg:#050506;--surface:#0e0e11;--border:#1d1d22;--brand:#6EE7B7;
    --brand-soft:rgba(110,231,183,.08);--brand-line:rgba(110,231,183,.35);
    --muted:#84848c;--muted-strong:#a8a8b0;--fg:#ededf0;--neg:#ff6b6b;--neg-line:rgba(255,107,107,.4);
    --track:#17171b;--radius-md:12px;--radius-pill:999px;
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace;
    --space-3:10px;--space-4:14px;--space-5:18px;--space-8:28px;--duration:.2s;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-display);display:flex;justify-content:center;padding:40px 20px}
  .shell{width:100%;max-width:620px}
  .header{margin-bottom:22px}
  .title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0}
  .subtitle{color:var(--muted);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0}
  .card{border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:18px}
  .cardName{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:14px}
  .calHead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .calMath{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .calCell{display:flex;flex-direction:column;gap:2px}
  .calCell .n{font-weight:600;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .calCell .l{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .calOp{font-size:22px;color:var(--muted)}
  .calCell.remain .n{color:var(--brand)}
  .calCell.remain.over .n{color:var(--neg)}
  .goalEdit{display:flex;align-items:center;gap:8px}
  .fieldInput{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit}
  .fieldInput:focus{outline:none;border-color:var(--brand)}
  .goalEdit .fieldInput{width:92px}
  .planTop{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .planMeal{position:relative;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:12px 14px;margin-bottom:10px}
  .planHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .planItems{margin-top:7px;line-height:1.6}
  .pdTabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
  .pdTab{appearance:none;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:var(--radius-pill);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .pdTab:hover{color:var(--fg)}
  .pdTab.on{background:var(--brand-soft, rgba(110,231,183,.12));border-color:var(--brand, #6EE7B7);color:var(--brand, #6EE7B7)}
  .pdTab.today:not(.on){border-color:var(--brand, #6EE7B7)}
  /* two columns like the Train tile: consistency + countdown on the left */
  .layout{display:flex;gap:18px;align-items:flex-start;width:100%;max-width:960px}
  .sideCol{flex:none;width:216px;position:sticky;top:16px}
  .shell{flex:1;min-width:0}
  @media (max-width:780px){ .layout{display:block} .sideCol{width:100%;position:static;margin-bottom:14px} }
  .sideWrap{position:relative;margin-bottom:14px}
  .weekCard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:22px 16px 20px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
  .weekCard.full{border-color:var(--brand);box-shadow:0 0 30px rgba(110,231,183,.24);background:rgba(110,231,183,.05)}
  .weekRing{width:84px;height:84px;margin-bottom:8px}
  .weekRing svg{width:100%;height:100%;display:block}
  .weekRingNum{font-family:var(--font-mono);font-size:12.5px;font-weight:600;fill:var(--fg)}
  .weekTitle{font-family:Georgia,serif;font-style:italic;font-size:19px;line-height:1.2}
  .weekCard.full .weekTitle{color:var(--brand)}
  .weekSub{font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:4px}
  .weekDays{display:flex;gap:5px;margin-top:11px;justify-content:center}
  .weekDays .wd{width:19px;height:19px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-family:var(--font-mono);font-size:9px;color:var(--muted)}
  .weekDays .wd.on{background:var(--brand);border-color:var(--brand);color:#04140d;font-weight:700}
  .weekDays .wd.today:not(.on){border-color:var(--brand);color:var(--brand)}
  .goalCard{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
  .goalCard .gTitle{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:11px}
  .goalRow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--border)}
  .goalRow:first-of-type{border-top:none;padding-top:0}
  .goalName{font-family:Georgia,serif;font-style:italic;font-size:15px}
  .goalLeft{font-family:var(--font-mono);font-size:11px;color:var(--brand);white-space:nowrap}
  .goalLeft.soon{color:#F5B044}
  .cardWrap{position:relative}
  .cardGrip{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:5;background:none;border:none;color:var(--muted);opacity:.45;font-size:13px;letter-spacing:2px;line-height:1;padding:5px 18px;cursor:grab;touch-action:none}
  .cardGrip:hover{opacity:1;color:var(--fg)}
  .mealGrip{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;background:none;border:none;color:var(--muted);opacity:.4;font-size:11px;letter-spacing:2px;line-height:1;padding:3px 14px;cursor:grab;touch-action:none}
  .mealGrip:hover{opacity:1;color:var(--fg)}
  .bar{height:10px;border-radius:var(--radius-pill);background:var(--track);overflow:hidden}
  .barFill{height:100%;border-radius:var(--radius-pill);background:var(--brand);transition:width var(--duration) ease}
  .barFill.over{background:var(--neg)}
  .macroGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  @media(max-width:560px){.macroGrid{grid-template-columns:repeat(2,1fr)}}
  .macroBox{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg)}
  .macroBox[data-accent="cal"]{border-color:var(--brand-line);background:var(--brand-soft)}
  .macroVal{font-weight:600;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .macroLabel{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .sectionTitle{font-weight:600;font-size:17px;margin:28px 0 0}
  .search{margin:18px 0 10px}
  .search .fieldInput{width:100%}
  .results,.logList{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .foodRow,.logRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
  .foodName{font-weight:600;font-size:14px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
  .nums{font-family:var(--font-mono);font-size:11px;color:var(--muted-strong)}
  .gramInput{width:74px}
  .btn{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer}
  .btn-primary{background:var(--brand);color:#04140d;border:none;font-weight:600}
  .xBtn{background:transparent;border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer;flex-shrink:0}
  .xBtn:hover{color:var(--neg);border-color:var(--neg-line)}
  .empty{color:var(--muted);font-size:13px;padding:12px 0}
  .hint{color:var(--neg);font-size:12px;font-family:var(--font-mono);min-height:14px;margin-top:4px}
  .hint.ok{color:var(--muted)}
  /* protein target bar under the calorie bar */
  .bar.slim{height:7px;margin-top:9px}
  .barFill.protein{background:#a7f3d0}
  .barFill.protein.hit{background:var(--brand)}
  .pNote{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:6px}
  .pNote b{color:var(--fg)}
  .pNote .hit{color:var(--brand)}
  /* history chart */
  .chart{width:100%;height:130px;display:block;overflow:visible;margin-top:6px}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .legItem{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .legDot{width:12px;height:3px;border-radius:2px}
  .histDetail{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
  .histDetail .meta{line-height:1.7}
  #chartTip{position:fixed;z-index:99;display:none;pointer-events:none;background:#101014;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;font-family:var(--font-mono);font-size:11px;color:var(--fg);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .tipHit{cursor:pointer}
  /* inline gram editing in the log */
  .gInline{width:52px;background:transparent;border:none;outline:none;border-bottom:1px solid transparent;color:var(--muted);font-family:var(--font-mono);font-size:11px;text-align:right;padding:0 1px;-moz-appearance:textfield;appearance:textfield}
  .gInline::-webkit-outer-spin-button,.gInline::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .gInline:hover{border-bottom-color:var(--brand-line)}
  .gInline:focus{color:var(--brand);border-bottom-color:var(--brand)}
  /* barcode scanner */
  .scanRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .scanRow .fieldInput{flex:1;min-width:130px}
  .scanResult{margin-top:10px}
  .chipRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:hover{color:var(--brand);border-color:var(--brand)}
</style>
</head>
<body>
<main><div class="layout">
  <aside class="sideCol" id="side"></aside>
  <div class="shell" id="app"></div>
</div></main>
<script>
/* Fuel — daily food + macro tracker. Ported from the Patron "Macros" standalone:
   reskinned to Vitality mint, sealed (no external assets), and persisting through
   the dashboard bridge (window.Vitality) instead of localStorage. */
const FOODS=[
  {name:'Chicken breast',cal:165,p:31,c:0,f:3.6},{name:'Beef mince (5%)',cal:137,p:21,c:0,f:5},
  {name:'Salmon',cal:208,p:20,c:0,f:13},{name:'Egg',cal:143,p:13,c:1.1,f:9.5},
  {name:'Greek yogurt',cal:59,p:10,c:3.6,f:0.4},{name:'Whey protein',cal:400,p:80,c:8,f:6},
  {name:'White rice',cal:130,p:2.7,c:28,f:0.3},{name:'Oats',cal:389,p:17,c:66,f:7},
  {name:'Pasta (cooked)',cal:157,p:6,c:31,f:0.9},{name:'Potato',cal:77,p:2,c:17,f:0.1},
  {name:'Sweet potato',cal:86,p:1.6,c:20,f:0.1},{name:'Banana',cal:89,p:1.1,c:23,f:0.3},
  {name:'Apple',cal:52,p:0.3,c:14,f:0.2},{name:'Broccoli',cal:34,p:2.8,c:7,f:0.4},
  {name:'Almonds',cal:579,p:21,c:22,f:50},{name:'Peanut butter',cal:588,p:25,c:20,f:50},
  {name:'Olive oil',cal:884,p:0,c:0,f:100},{name:'Avocado',cal:160,p:2,c:9,f:15},
  {name:'Cheddar cheese',cal:402,p:25,c:1.3,f:33},{name:'Milk (whole)',cal:61,p:3.2,c:4.8,f:3.3},
  {name:'Bread (slice)',cal:265,p:9,c:49,f:3.2},{name:'Tuna (canned)',cal:116,p:26,c:0,f:1},
  {name:'Tofu (extra-firm)',cal:90,p:10,c:2,f:5},
  {name:'Gold Standard Whey (Vanilla)',cal:395,p:79,c:10,f:5},
  {name:'Spinach',cal:23,p:2.9,c:3.6,f:0.4},{name:'Bell pepper',cal:31,p:1,c:6,f:0.3},
  {name:'Green beans',cal:31,p:1.8,c:7,f:0.2},{name:'Zucchini',cal:17,p:1.2,c:3.1,f:0.3},
  {name:'Carrots',cal:41,p:0.9,c:10,f:0.2},{name:'Cucumber',cal:15,p:0.7,c:3.6,f:0.1},
  {name:'Salad greens',cal:17,p:1.5,c:3,f:0.2},{name:'Mushrooms',cal:22,p:3.1,c:3.3,f:0.3},
  {name:'Asparagus',cal:20,p:2.2,c:3.9,f:0.1},{name:'Edamame',cal:121,p:11,c:9,f:5}
];

/* ---- the weekly meal schedule (Train-style day tabs) ----------------
   139 lb · 5'11" · ~20-25% BF (skinny-fat pattern) · trains 6 days/week.
   Strategy is RECOMP, not a hard cut: lift days ~2,300 kcal, climb days
   ~2,380 (extra carbs for the wall), rest day ~1,820 (lightest — protein
   stays pinned). '@main' items resolve to chicken or tofu via the toggle;
   one scoop = 31g Gold Standard vanilla whey. Meals are materialized into
   the store per day so each day's order is drag-and-droppable. */
const PLAN_TARGET = { cal:2400, p:150 };
const WEEK=['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABEL={mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',fri:'Fri',sat:'Sat',sun:'Sun'};
const DAY_TYPE={mon:'climb',tue:'lift',wed:'climb',thu:'lift',fri:'climb',sat:'lift',sun:'rest'};
const DAY_FOCUS={lift:'Lift day — training fuel',climb:'Climb day — carbs up for the wall',rest:'Rest day — lightest, protein stays'};
/* Lunch + dinner rotate through the week (new combo every 2-3 days, two
   veg per plate); breakfasts and snacks stay stable for easy prep. */
const DAY_LD={
  mon:{ lunch:{ name:'Lunch — @main pasta, spinach + zucchini', items:[['@main',150],['Pasta (cooked)',250],['Spinach',100],['Zucchini',150],['Olive oil',8]] },
        dinner:{ name:'Post-climb — @main, potatoes, peppers + mushrooms', items:[['@main',150],['Potato',350],['Bell pepper',100],['Mushrooms',100],['Olive oil',8]] } },
  tue:{ lunch:{ name:'Lunch — @main rice bowl, broccoli + carrots', items:[['@main',150],['White rice',250],['Broccoli',100],['Carrots',100],['Olive oil',8]] },
        dinner:{ name:'Dinner — @main, sweet potato + green beans', items:[['@main',150],['Sweet potato',300],['Green beans',150],['Olive oil',8]] } },
  wed:{ lunch:{ name:'Lunch — @main rice bowl, edamame + cucumber', items:[['@main',150],['White rice',230],['Edamame',75],['Cucumber',100],['Olive oil',8]] },
        dinner:{ name:'Post-climb — @main pasta, zucchini + mushrooms', items:[['@main',150],['Pasta (cooked)',210],['Zucchini',150],['Mushrooms',100],['Olive oil',8]] } },
  thu:{ lunch:{ name:'Lunch — @main fajita bowl (peppers + avocado)', items:[['@main',150],['White rice',250],['Bell pepper',150],['Avocado',50],['Olive oil',5]] },
        dinner:{ name:'Dinner — @main pasta, mushrooms + spinach', items:[['@main',150],['Pasta (cooked)',200],['Mushrooms',100],['Spinach',100],['Olive oil',8]] } },
  fri:{ lunch:{ name:'Lunch — @main pasta, peppers + spinach', items:[['@main',150],['Pasta (cooked)',250],['Bell pepper',100],['Spinach',100],['Olive oil',8]] },
        dinner:{ name:'Post-climb — @main, potatoes, carrots + green beans', items:[['@main',150],['Potato',350],['Carrots',100],['Green beans',100],['Olive oil',8]] } },
  sat:{ lunch:{ name:'Lunch — @main stir-fry rice, green beans + mushrooms', items:[['@main',150],['White rice',250],['Green beans',100],['Mushrooms',100],['Olive oil',8]] },
        dinner:{ name:'Dinner — @main, sweet potato + asparagus', items:[['@main',150],['Sweet potato',300],['Asparagus',150],['Olive oil',8]] } },
  sun:{ lunch:{ name:'Lunch — @main big salad (greens, cucumber, peppers, avocado)', items:[['@main',150],['Salad greens',100],['Cucumber',100],['Bell pepper',100],['Avocado',70],['Olive oil',8]] },
        dinner:{ name:'Dinner — @main, sweet potato + asparagus', items:[['@main',150],['Sweet potato',250],['Asparagus',150],['Olive oil',8]] } },
};
function planDayMeals(k){
  const type=DAY_TYPE[k];
  const bfast = type==='rest'
    ? { id:'m1', name:'Breakfast — yogurt whey bowl', when:'~9:00', items:[['Greek yogurt',200],['Gold Standard Whey (Vanilla)',31],['Banana',100]] }
    : { id:'m1', name:'Breakfast — vanilla protein oats', when:'~8:00', items:[['Oats',70],['Gold Standard Whey (Vanilla)',31],['Banana',100],['Peanut butter',15]] };
  const snack = type==='climb'
    ? { id:'m3', name:'Pre-climb — quick carbs', when:'45 min before', items:[['Banana',100],['Peanut butter',15]] }
    : type==='rest'
      ? { id:'m3', name:'Snack — apple + almonds', when:'afternoon', items:[['Apple',150],['Almonds',20]] }
      : { id:'m3', name:'Snack — yogurt + fruit', when:'pre-train', items:[['Greek yogurt',170],['Apple',150]] };
  const evening = type==='climb'
    ? { id:'m5', name:'Evening — vanilla shake + yogurt', when:'before bed', items:[['Gold Standard Whey (Vanilla)',31],['Greek yogurt',170]] }
    : type==='rest'
      ? { id:'m5', name:'Evening — yogurt + peanut butter', when:'before bed', items:[['Greek yogurt',170],['Peanut butter',15]] }
      : { id:'m5', name:'Evening — vanilla shake + almonds', when:'before bed', items:[['Gold Standard Whey (Vanilla)',31],['Almonds',15]] };
  const ld=DAY_LD[k];
  return [
    bfast,
    { id:'m2', when:'~12:30', ...ld.lunch },
    snack,
    { id:'m4', when:(type==='climb'?'after the gym':type==='lift'?'post-train':'evening'), ...ld.dinner },
    evening,
  ];
}
const PLAN_V=3;
function ensurePlan(){
  if(store.plan && store.plan.v===PLAN_V) return;
  const days={};
  WEEK.forEach(k=>{ days[k]={ meals: planDayMeals(k) }; });
  store.plan={ v:PLAN_V, days };
  persist();
}
function todayDayKey(){ return WEEK[(new Date().getDay()+6)%7]; }
let planDay=null; /* set at boot to today's weekday */
function planProtein(){ return store.planProtein==='tofu' ? 'tofu' : 'chicken'; }
/* '@main' resolves to the chosen protein; tofu portions scale ~1.85x so the
   protein grams roughly match chicken's */
function resolveItem(it){
  const [n,g]=it;
  if(n!=='@main') return it;
  return planProtein()==='tofu' ? ['Tofu (extra-firm)', Math.round(g*1.85/5)*5] : ['Chicken breast', g];
}
function mealName(m){ return m.name.replace('@main', planProtein()==='tofu'?'tofu':'chicken'); }
function foodByName(n){ return FOODS.find(f=>f.name===n); }
function mealTotals(meal){
  return meal.items.reduce((s,it)=>{ const [n,g]=resolveItem(it); const f=foodByName(n); if(!f) return s; const k=g/100;
    s.cal+=f.cal*k; s.p+=f.p*k; s.c+=f.c*k; s.f+=f.f*k; return s; },{cal:0,p:0,c:0,f:0});
}
let store={};
const $=id=>document.getElementById(id);
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function persist(){window.Vitality.save(store).catch(()=>{});} /* host may reject (quota); tile state stays live */
function todaysLog(){return store[todayKey()]||[];}
function setTodaysLog(l){store[todayKey()]=l;persist();}
function goalCal(){return store.goalCal!=null?store.goalCal:PLAN_TARGET.cal;}
function setGoalCal(n){store.goalCal=n;persist();}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const round=n=>Math.round(n);
let query='',matches=[];
function totals(){return todaysLog().reduce((t,e)=>{t.cal+=e.cal;t.p+=e.p;t.c+=e.c;t.f+=e.f;return t;},{cal:0,p:0,c:0,f:0});}
function summaryHtml(){
  const t=totals(),goal=goalCal(),remaining=goal-t.cal,over=remaining<0,pct=Math.min(100,goal>0?(t.cal/goal)*100:0);
  const cell=(cls,n,l)=>'<div class="calCell '+cls+'"><span class="n">'+round(n)+'</span><span class="l">'+l+'</span></div>';
  const head='<div class="calHead"><div class="calMath">'+cell('',goal,'goal')+'<span class="calOp">−</span>'+cell('',t.cal,'food')+'<span class="calOp">=</span>'+cell('remain'+(over?' over':''),Math.abs(remaining),over?'over':'remaining')+'</div>'
    +'<div class="goalEdit"><span class="calCell"><span class="l">daily goal</span></span><input class="fieldInput" id="goal" type="number" min="0" step="50" value="'+goal+'" /></div></div>';
  const bar='<div class="bar"><div class="barFill'+(over?' over':'')+'" style="width:'+pct+'%"></div></div>';
  /* the protein line the on-plan ring judges you by, made visible */

/* ---- barcode scanner: photo (or typed digits) → Open Food Facts ------

   the Open Food Facts public API (CORS-open, no key) so a barcode photo

   everywhere. Found products cache in store._products, and adding one
   pushes into todaysLog like any other food — the Today ring, on-plan
   marks and macros all just see food. */
let scanStatus='Snap the barcode, type its digits — or photo the whole plate and Claude estimates it.', scanOk=true, scanProd=null, scanBusy=false, scanCode='';
let aiEst=null; /* {name, portion_grams, cal, protein_g, carbs_g, fat_g, confidence, notes} */
function scanHtml(){
  const p=scanProd;
  const prodRow = p
    ? '<div class="foodRow scanResult"><div><div class="foodName">'+esc(p.name)+(p.brand?' <span class="meta">· '+esc(p.brand)+'</span>':'')+'</div>'
      +'<div class="meta">'+round(p.per100.cal)+' kcal · '+round(p.per100.p)+'P / '+round(p.per100.c)+'C / '+round(p.per100.f)+'F per 100g</div></div>'
      +'<div style="display:flex;align-items:center;gap:8px"><input class="fieldInput gramInput" id="scanGrams" type="number" min="0" placeholder="g" value="100" /><button class="btn btn-primary" data-scanadd>Add</button></div></div>'
    : '';
  const a=aiEst;
  const aiRow = a
    ? '<div class="foodRow scanResult"><div><div class="foodName">'+esc(a.name)+' <span class="meta">· Claude estimate ('+esc(a.confidence)+' confidence)</span></div>'
      +'<div class="meta">~'+round(a.portion_grams)+'g portion · '+round(a.cal)+' kcal · '+round(a.protein_g)+'P / '+round(a.carbs_g)+'C / '+round(a.fat_g)+'F</div>'
      +(a.notes?'<div class="meta">'+esc(a.notes)+'</div>':'')+'</div>'
      +'<div style="display:flex;align-items:center;gap:8px"><input class="fieldInput gramInput" id="aiMult" type="number" min="0" step="0.25" value="1" title="Portion multiplier — 0.5 if you ate half" /><button class="btn btn-primary" data-aiadd>Add</button></div></div>'
    : '';
  const recents=(store._recentScans||[]).map(c=>store._products&&store._products[c]).filter(Boolean);
  const chips=recents.length
    ? '<div class="chipRow">'+recents.map(r=>'<button class="chip" data-scanrecent="'+esc(r.code)+'" title="'+esc(r.name)+'">'+esc(r.name)+'</button>').join('')+'</div>'
    : '';
  return '<h2 class="sectionTitle" style="margin-top:0">Scan or snap</h2>'
    +'<div class="scanRow">'
    +'<button class="btn btn-primary" data-scanphoto'+(scanBusy?' disabled':'')+'>&#128247; barcode</button>'
    +'<button class="btn btn-primary" data-platephoto'+(scanBusy?' disabled':'')+'>&#127869;&#65039; estimate a plate</button>'
    +'<input class="fieldInput" id="scanCode" type="text" inputmode="numeric" autocomplete="off" placeholder="or type barcode digits" value="'+esc(scanCode)+'" />'
    +'<button class="btn" data-scanlookup'+(scanBusy?' disabled':'')+'>look up</button>'
    +'</div>'
    +'<input id="scanFile" type="file" accept="image/*" capture="environment" style="display:none">'
    +'<input id="plateFile" type="file" accept="image/*" capture="environment" style="display:none">'

function renderScan(){ const w=document.querySelector('[data-card="scan"] .cardBody'); if(w) w.innerHTML=scanHtml(); }
function noteScan(msg,ok){ scanStatus=msg; scanOk=!!ok; renderScan(); }
function rememberScan(prod){
  store._products=store._products||{}; store._products[prod.code]=prod;
  store._recentScans=[prod.code].concat((store._recentScans||[]).filter(c=>c!==prod.code)).slice(0,6);
  persist();
}
async function lookupBarcode(raw){
  const code=String(raw||'').replace(/\D/g,'');
  if(code.length<8||code.length>14){ scanProd=null; noteScan('That doesn’t look like a product barcode — expect 8–13 digits.'); return; }
  const cached=store._products&&store._products[code];
  if(cached){ scanProd=cached; scanCode=code; rememberScan(cached); noteScan('Found it (saved earlier) — set the grams and add it.',true); return; }
  scanBusy=true; scanProd=null; noteScan('Searching the web for '+code+'…',true);
  try{
    const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments');
    const j=await res.json();
    if(!res.ok || j.status===0 || !j.product) throw new Error('notfound');
    const n=j.product.nutriments||{};
    const num=k=>{ const v=Number(n[k]); return isFinite(v)?v:0; };
    const per100={ cal:num('energy-kcal_100g'), p:num('proteins_100g'), c:num('carbohydrates_100g'), f:num('fat_100g') };
    if(!per100.cal && num('energy_100g')) per100.cal=Math.round(num('energy_100g')/4.184); /* kJ fallback */
    const prod={ code, name:(j.product.product_name||'').trim()||('Product '+code), brand:String(j.product.brands||'').split(',')[0].trim(), per100 };
    rememberScan(prod);
    scanProd=prod; scanCode=code;
    noteScan('Found it — set the grams and add it to today.',true);
  }catch(err){
    scanProd=null;
    noteScan(err&&err.message==='notfound'
      ? 'No product found for '+code+' — it isn’t in the Open Food Facts database. Log it with the search below instead.'
      : 'Lookup failed — check the connection and try again.');
  }
  scanBusy=false; renderScan();
}
/* plate photo → downscale → the host relays it to the server's Claude vision
   route → macro estimate for the whole visible portion */
function downscalePlate(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1024, sc=Math.min(1, MAX/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.8));
      };
      img.onerror=()=>res(null);
      img.src=fr.result;
    };
    fr.onerror=()=>res(null);
    fr.readAsDataURL(file);
  });
}
async function estimatePlate(file){
  if(!(window.Vitality && typeof window.Vitality.estimateFood==='function')){
    noteScan('AI estimates load with the page — reload the dashboard, then try again.');
    return;
  }
  scanBusy=true; aiEst=null; noteScan('Asking Claude to size up the plate… (can take ~15s)',true);
  const url=await downscalePlate(file);
  if(!url){ scanBusy=false; noteScan('Couldn’t read that photo — try again.'); return; }
  let r=null;
  try{ r=await window.Vitality.estimateFood(url); }catch(err){ r=null; }
  scanBusy=false;
  if(!r || !r.ok || !r.est){
    const code=r&&r.error;
    noteScan(code==='no_key' ? 'AI estimates need an ANTHROPIC_API_KEY on the server — add it to .env.local and the Vercel env, then redeploy.'
      : code==='rate_limited' ? 'Claude is rate-limited right now — try again in a minute.'
      : code==='timeout' ? 'The estimate timed out — try again.'
      : 'Estimate failed — check the connection and try again.');
    renderScan(); return;
  }
  aiEst=r.est;
  noteScan('Claude sized it up — it’s an estimate, so adjust the portion multiplier if you ate more or less.',true);
  renderScan();
}
async function decodeBarcodePhoto(file){
  if(!('BarcodeDetector' in window)){
    noteScan('This browser can’t read barcodes from photos — type the digits instead.');
    return;
  }
  noteScan('Reading the barcode…',true);
  try{
    const det=new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128'] });
    const bmp=await createImageBitmap(file);
    const found=await det.detect(bmp);
    if(!found.length){ noteScan('No barcode in that photo — get closer so it fills the frame, or type the digits.'); return; }
    await lookupBarcode(found[0].rawValue);
  }catch(err){
    noteScan('Couldn’t read that photo — try again, or type the digits.');
  }
}

/* ---- history: the last 14 days, judged by the same on-plan rule ------ */
let histSel=null;
function dayEntries(k){ const l=store[k]; return Array.isArray(l)?l:null; }
function dayTotalsOf(k){ return (dayEntries(k)||[]).reduce((t,e)=>{t.cal+=e.cal;t.p+=e.p;t.c+=e.c;t.f+=e.f;return t;},{cal:0,p:0,c:0,f:0}); }
function lastNDates(n){
  return Array.from({length:n},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(n-1-i));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); });
}
function fmtDay(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function historyHtml(){
  const days=lastNDates(14);
  const data=days.map(k=>({k, n:(dayEntries(k)||[]).length, t:dayTotalsOf(k)}));
  const logged=data.filter(d=>d.n>0);
  if(logged.length<2) return '<section class="card"><span class="cardName">History — last 14 days</span><p class="empty">Log food on a couple of days and the last two weeks chart here.</p></section>';
  const goal=goalCal();
  const W=320,H=120,padX=6,top=12,base=H-14;
  const maxC=Math.max(goal*1.15,...data.map(d=>d.t.cal));
  const slot=(W-padX*2)/14, bw=slot*0.6;
  const Y=v=>base-(v/maxC)*(base-top);
  let bars='';
  data.forEach((d,i)=>{
    if(!d.n) return;
    const onplan=d.t.p>=PLAN_TARGET.p&&d.t.cal<=goal+50;
    const over=d.t.cal>goal+50;
    const fill=onplan?'var(--brand)':over?'var(--neg)':'#84848c';
    const x=padX+i*slot+(slot-bw)/2, y=Y(d.t.cal);
    const tip=fmtDay(d.k)+' · '+round(d.t.cal)+' kcal · '+round(d.t.p)+'g protein'+(onplan?' · on plan ✓':over?' · over goal':'');
    bars+='<rect class="tipHit" data-histday="'+d.k+'" data-tip="'+esc(tip)+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(base-y).toFixed(1)+'" rx="2.5" fill="'+fill+'"'+(onplan?'':' opacity=".6"')+(d.k===histSel?' stroke="var(--fg)" stroke-width="1"':'')+'/>';
  });
  const gy=Y(goal);
  const goalLine='<line x1="'+padX+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padX)+'" y2="'+gy.toFixed(1)+'" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-dasharray="5 4"/>'
    +'<text x="'+(W-padX)+'" y="'+(gy-4).toFixed(1)+'" text-anchor="end" fill="var(--muted)" font-size="8" font-family="ui-monospace,Menlo,monospace" letter-spacing=".08em">GOAL '+goal+'</text>';
  /* 7-day recap under the chart */
  const w7=data.slice(-7).filter(d=>d.n>0);
  const avg=f=>w7.length?round(w7.reduce((s,d)=>s+f(d),0)/w7.length):0;
  const onplan7=data.slice(-7).filter(d=>d.n>0&&d.t.p>=PLAN_TARGET.p&&d.t.cal<=goal+50).length;
  const recap='<div class="pNote" style="margin-top:10px">7-day: <b>'+avg(d=>d.t.cal)+'</b> kcal · <b>'+avg(d=>d.t.p)+'g</b> protein avg · <b>'+onplan7+'</b>/7 on plan</div>';
  /* tapped day: what was eaten */
  let detail='';
  if(histSel && dayEntries(histSel)){
    const l=dayEntries(histSel), t=dayTotalsOf(histSel);
    detail='<div class="histDetail"><div class="foodName" style="margin-bottom:4px">'+fmtDay(histSel)+' <span class="meta">'+round(t.cal)+' kcal · '+round(t.p)+'P / '+round(t.c)+'C / '+round(t.f)+'F</span></div>'
      +'<div class="meta">'+l.map(e=>esc(e.name)+' '+round(e.grams)+'g ('+round(e.cal)+' kcal)').join(' · ')+'</div></div>';
  }
  return '<section class="card"><span class="cardName">History — last 14 days</span>'
    +'<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+goalLine+bars+'</svg>'
    +'<div class="legend"><span class="legItem"><span class="legDot" style="background:var(--brand)"></span>On plan</span>'
    +'<span class="legItem"><span class="legDot" style="background:#84848c"></span>Off plan</span>'
    +'<span class="legItem"><span class="legDot" style="background:var(--neg)"></span>Over goal</span>'
    +'<span class="legItem" style="color:var(--muted)">tap a bar to see the day</span></div>'
    +recap+detail+'</section>';
}

/* chart tooltips (hover / tap a bar) — same pattern as the Vitals tile */
function tipEl(){ let t=$('chartTip'); if(!t){ t=document.createElement('div'); t.id='chartTip'; document.body.appendChild(t); } return t; }
function moveTip(e){ const t=tipEl(); let x=e.clientX+12,y=e.clientY-34; const w=t.offsetWidth||120;
  if(x+w>window.innerWidth-8)x=e.clientX-w-12; if(y<8)y=e.clientY+18; t.style.left=x+'px'; t.style.top=y+'px'; }
document.addEventListener('pointerover',e=>{ const h=e.target.closest&&e.target.closest('.tipHit'); if(!h)return; const t=tipEl(); t.textContent=h.getAttribute('data-tip'); t.style.display='block'; moveTip(e); });
document.addEventListener('pointermove',e=>{ const t=$('chartTip'); if(!t||t.style.display!=='block')return; if(e.target.closest&&e.target.closest('.tipHit')) moveTip(e); else t.style.display='none'; });
document.addEventListener('pointerout',e=>{ if(e.target.closest&&e.target.closest('.tipHit')){ const rel=e.relatedTarget; if(!(rel&&rel.closest&&rel.closest('.tipHit'))){ const t=$('chartTip'); if(t)t.style.display='none'; } } });

/* ---- draggable card layout (same system as the Vitals tile) -------- */
const CARD_KEYS=['today','scan','plan','add','log','hist'];
function cardHtml(k){
  if(k==='today') return summaryHtml();
  if(k==='scan') return '<section class="card">'+scanHtml()+'</section>';
  if(k==='plan') return planHtml();
  if(k==='add') return searchHtml();
  if(k==='hist') return historyHtml();
  return logHtml();
}
function cardOrder(){
  const saved=Array.isArray(store._cardOrder)?store._cardOrder:[];
  const out=[]; const seen={};
  saved.forEach(k=>{ if(CARD_KEYS.includes(k)&&!seen[k]){ out.push(k); seen[k]=1; } });
  /* cards added after an order was saved slot in at their canonical spot */
  CARD_KEYS.forEach(k=>{ if(!seen[k]) out.splice(Math.min(CARD_KEYS.indexOf(k),out.length),0,k); });
  return out;
}
function render(){
  $('app').innerHTML=headerHtml()
    + cardOrder().map(k=>'<div class="cardWrap" data-card="'+k+'">'
        +'<button class="cardGrip" data-cardgrip="'+k+'" aria-label="Drag to reorder" title="Drag to reorder">&#10495;</button>'
        +'<div class="cardBody">'+cardHtml(k)+'</div></div>').join('');
  renderSide();
}

/* ---- drag & drop: tile cards and plan meals (ghost follows pointer) -- */
let fuelDrag=null;
function startGhost(wrap){
  const r=wrap.getBoundingClientRect();
  const ghost=wrap.cloneNode(true);
  ghost.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;z-index:90;pointer-events:none;opacity:.92;box-shadow:0 18px 50px rgba(0,0,0,.6);';
  document.body.appendChild(ghost);
  wrap.style.opacity='.3';
  return ghost;
}
document.addEventListener('pointerdown',e=>{
  if(fuelDrag) return;
  const mg=e.target.closest('[data-mealgrip]');
  if(mg){
    e.preventDefault();
    const id=mg.getAttribute('data-mealgrip');
    const wrap=document.querySelector('[data-mealid="'+id+'"]');
    fuelDrag={ kind:'meal', k:id, ghost:startGhost(wrap), sx:e.clientX, sy:e.clientY, last:null };
    return;
  }
  const sg=e.target.closest('[data-sidegrip]');
  if(sg){
    e.preventDefault();
    const k=sg.getAttribute('data-sidegrip');
    const wrap=document.querySelector('[data-side="'+k+'"]');
    fuelDrag={ kind:'side', k, ghost:startGhost(wrap), sx:e.clientX, sy:e.clientY, last:null };
    return;
  }
  const cg=e.target.closest('[data-cardgrip]');
  if(cg){
    e.preventDefault();
    const k=cg.getAttribute('data-cardgrip');
    const wrap=document.querySelector('[data-card="'+k+'"]');
    fuelDrag={ kind:'card', k, ghost:startGhost(wrap), sx:e.clientX, sy:e.clientY, last:null };
  }
});
const DRAG_ATTR={ meal:'data-mealid', card:'data-card', side:'data-side' };
document.addEventListener('pointermove',e=>{
  const d=fuelDrag; if(!d) return;
  d.ghost.style.transform='translate('+(e.clientX-d.sx)+'px,'+(e.clientY-d.sy)+'px)';
  const attr=DRAG_ATTR[d.kind];
  const under=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.getAttribute && n.getAttribute(attr) && n.getAttribute(attr)!==d.k);
  const t=under?under.getAttribute(attr):null;
  if(t && t!==d.last){
    d.last=t;
    if(d.kind==='meal'){
      const dayK=planDay||todayDayKey();
      const meals=store.plan.days[dayK].meals;
      const from=meals.findIndex(m=>m.id===d.k), to=meals.findIndex(m=>m.id===t);
      if(from>=0&&to>=0){ const [m]=meals.splice(from,1); meals.splice(to,0,m); persist(); }
    } else if(d.kind==='side'){
      const cur=sideOrder();
      cur.splice(cur.indexOf(d.k),1);
      cur.splice(cur.indexOf(t),0,d.k);
      store._sideOrder=cur; persist();
    } else {
      const cur=cardOrder();
      cur.splice(cur.indexOf(d.k),1);
      cur.splice(cur.indexOf(t),0,d.k);
      store._cardOrder=cur; persist();
    }
    render();
    const w=document.querySelector('['+attr+'="'+d.k+'"]'); if(w) w.style.opacity='.3';
  }
  if(!t) d.last=null;
});
function endFuelDrag(){
  const d=fuelDrag; if(!d) return;
  d.ghost.remove();
  const w=document.querySelector('['+DRAG_ATTR[d.kind]+'="'+d.k+'"]');
  if(w) w.style.opacity='';
  fuelDrag=null;
}
document.addEventListener('pointerup',endFuelDrag);
document.addEventListener('pointercancel',endFuelDrag);
document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value;$('results').innerHTML=resultsInner();$('hint').textContent='';}
  if(e.target.id==='goal'){const n=Number(e.target.value);setGoalCal(isFinite(n)&&n>=0?n:0);render();$('goal').focus();}
  if(e.target.id==='scanCode'){scanCode=e.target.value;}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='scanCode' && e.key==='Enter'){ e.preventDefault(); lookupBarcode(scanCode); }
});
document.addEventListener('change',e=>{
  if(e.target.matches&&e.target.matches('[data-editg]')){
    const i=Number(e.target.getAttribute('data-editg'));
    const log=todaysLog(); const en=log[i];
    const g=Number(e.target.value);
    if(en&&isFinite(g)&&g>0&&en.grams>0){
      const k=g/en.grams;
      en.grams=g; en.cal*=k; en.p*=k; en.c*=k; en.f*=k;
      setTodaysLog(log);
    }
    render(); return;
  }
  if(e.target.id==='scanFile'){
    const f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(f) decodeBarcodePhoto(f);
  }
  if(e.target.id==='plateFile'){
    const f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(f) estimatePlate(f);
  }
});
document.addEventListener('click',e=>{
  const sp=e.target.closest('[data-scanphoto]');
  if(sp){ const f=$('scanFile'); if(f) f.click(); return; }
  const pp2=e.target.closest('[data-platephoto]');
  if(pp2){ const f=$('plateFile'); if(f) f.click(); return; }
  const aa=e.target.closest('[data-aiadd]');
  if(aa){
    const a=aiEst; if(!a) return;
    const mEl=$('aiMult'); const mult=Number(mEl&&mEl.value);
    if(!isFinite(mult)||mult<=0){ noteScan('Set the portion multiplier (1 = the whole visible portion).'); return; }
    const log=todaysLog();
    log.push({ name:a.name+' (AI est.)', grams:Math.round(a.portion_grams*mult), cal:a.cal*mult, p:a.protein_g*mult, c:a.carbs_g*mult, f:a.fat_g*mult });
    setTodaysLog(log);
    aiEst=null;
    scanStatus='Added '+a.name+' to today.'; scanOk=true; /* raw — scanHtml escapes on render */
    render(); return;
  }
  const sl=e.target.closest('[data-scanlookup]');
  if(sl){ lookupBarcode(scanCode); return; }
  const sr=e.target.closest('[data-scanrecent]');
  if(sr){ lookupBarcode(sr.getAttribute('data-scanrecent')); return; }
  const sa=e.target.closest('[data-scanadd]');
  if(sa){
    const p=scanProd; if(!p) return;
    const gEl=$('scanGrams'); const grams=Number(gEl&&gEl.value);
    if(!isFinite(grams)||grams<=0){ noteScan('Enter how many grams you ate.'); return; }
    const k=grams/100, log=todaysLog();
    const label=p.brand && p.brand.toLowerCase()!==p.name.toLowerCase() ? p.name+' ('+p.brand+')' : p.name;
    log.push({ name:label, grams, cal:p.per100.cal*k, p:p.per100.p*k, c:p.per100.c*k, f:p.per100.f*k });
    setTodaysLog(log);
    scanStatus='Added '+grams+'g of '+p.name+' to today.'; scanOk=true;
    render(); return;
  }
  const add=e.target.closest('[data-add]');
  if(add){
    const f=matches[Number(add.getAttribute('data-add'))];
    const gEl=document.querySelector('[data-grams="'+add.getAttribute('data-add')+'"]');
    const grams=Number(gEl&&gEl.value);
    if(!f||!isFinite(grams)||grams<=0){const h=$('hint');if(h)h.textContent='Enter how many grams.';return;}
    const k=grams/100,log=todaysLog();
    log.push({name:f.name,grams,cal:f.cal*k,p:f.p*k,c:f.c*k,f:f.f*k});
    setTodaysLog(log);query='';render();return;
  }
  const del=e.target.closest('[data-del]');
  if(del){const log=todaysLog();log.splice(Number(del.getAttribute('data-del')),1);setTodaysLog(log);render();return;}
  const hb=e.target.closest('[data-histday]');
  if(hb){const k=hb.getAttribute('data-histday');histSel=histSel===k?null:k;render();return;}
  const pp=e.target.closest('[data-planprot]');
  if(pp){store.planProtein=pp.getAttribute('data-planprot');persist();render();return;}
  const pd=e.target.closest('[data-planday]');
  if(pd){planDay=pd.getAttribute('data-planday');render();return;}
  const lm=e.target.closest('[data-logmeal]');
  if(lm){
    const dayK=planDay||todayDayKey();
    const meal=store.plan.days[dayK].meals.find(m=>m.id===lm.getAttribute('data-logmeal'));
    if(!meal)return;
    const log=todaysLog();
    meal.items.forEach(it=>{ const [n,g]=resolveItem(it); const f=foodByName(n); if(!f)return; const k=g/100;
      log.push({name:f.name,grams:g,cal:f.cal*k,p:f.p*k,c:f.c*k,f:f.f*k}); });
    setTodaysLog(log);render();
  }
});
(async()=>{const d=await window.Vitality.load();store=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};ensurePlan();planDay=todayDayKey();render();})();
</script>
