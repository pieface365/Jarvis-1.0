<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Closet</title>
<style>
  :root{
    --bg:#0a0b0a; --card:#0e0e11; --fg:#ededf0; --muted:#84848c; --mint:#6EE7B7;
    --border:#1d1d22; --hair:#2a2a31; --neg:#e06a6c;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --serif:Georgia,"Times New Roman",serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* the [hidden] attribute must beat the display rules below (e.g. .lightbox/.pending
     set display:flex, which would otherwise override hidden and show them always) */
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans)}
  body{padding:18px calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));min-height:100dvh}
  h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:26px;margin:0 0 2px}
  .sub{color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 16px}
  form.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  input,select{background:rgba(255,255,255,.04);border:1px solid var(--hair);color:var(--fg);border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--mint)}
  #name{flex:1;min-width:130px}
  button.add-btn{background:var(--mint);color:#04140d;border:none;border-radius:10px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer}
  .cat{margin-top:18px}
  .cat-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:8px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:14px;line-height:1.35}
  .item .x{background:transparent;border:none;color:var(--muted);font-size:19px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0}
  .item .x:hover{color:var(--neg)}
  .empty{color:var(--muted);font-size:13.5px;line-height:1.65;padding:16px 4px}
  .empty strong{color:var(--mint);font-weight:600}
  /* snap-a-photo → Claude identifies the item */
  .snap{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .snap-btn{background:rgba(110,231,183,.10);border:1px solid var(--mint);color:var(--mint);border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .snap-btn:hover{background:rgba(110,231,183,.18)}
  .snap-btn:disabled{opacity:.5;cursor:default}
  .snap-hint{font-size:12.5px;color:var(--muted);line-height:1.4;flex:1;min-width:120px}
  .snap-hint.err{color:var(--neg)}
  .pending{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px;background:var(--card);border:1px solid var(--hair);border-radius:10px}
  .pending img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#000}
  .pending-txt{flex:1;font-size:12.5px;color:var(--muted);line-height:1.4}
  .pending-x{background:transparent;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0}
  .pending-x:hover{color:var(--neg)}
  .item .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#000;cursor:zoom-in}
  .item .iname{flex:1;min-width:0}
  /* lightbox: tap a thumbnail to view the photo enlarged, tap anywhere to close */
  .lightbox{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.86);cursor:zoom-out;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
  /* ---- AI stylist: outfit combos + shopping gaps from your wardrobe ---- */
  .stylist{margin-top:26px;border-top:1px solid var(--border);padding-top:18px}
  .style-h{font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 10px}
  .style-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .style-icons{width:100%;margin-bottom:8px}
  .style-row input{flex:1;min-width:150px}
  .style-hint{font-size:12.5px;color:var(--muted);line-height:1.45;min-height:14px;margin-bottom:4px}
  .style-hint.err{color:var(--neg)}
  .style-note{font-size:13px;color:var(--fg);line-height:1.5;margin:6px 0 12px}
  .style-sec{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .outfit{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px}
  .outfit-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .outfit-title{font-weight:600;font-size:14.5px}
  .outfit-occ{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mint);white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:999px;padding:4px 11px;font-size:12.5px}
  .chip.hasimg{padding:3px 11px 3px 3px}
  .chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;cursor:zoom-in}
  .outfit-why{font-size:12.5px;color:var(--muted);line-height:1.5}
  .gap{display:flex;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:13px;line-height:1.45}
  .gap b{color:var(--mint);font-weight:600;white-space:nowrap}
  .sources{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .sources a{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;text-decoration:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sources a:hover{color:var(--mint);border-color:var(--mint)}
</style>
</head>
<body>
  <h1>My Closet</h1>
  <p class="sub">Wardrobe · <span id="count">0 items</span></p>

  <!-- snap a photo → Claude names + categorises it, then it's added with a thumbnail -->
  <div class="snap">
    <button class="snap-btn" type="button" id="snapBtn">&#128247; Snap an item</button>
    <span class="snap-hint" id="hint"></span>
  </div>
  <input id="photoFile" type="file" accept="image/*" capture="environment" hidden />
  <div class="pending" id="pending" hidden></div>

  <!-- NOT a <form>: tiles run sandboxed with allow-scripts only (no allow-forms),
       so a real form submit is silently blocked. Add via a button click + Enter. -->
  <div class="add" id="addForm">
    <input id="name" placeholder="Add an item — e.g. Black denim jacket" autocomplete="off" />
    <select id="cat">
      <option>Tops</option>
      <option>Bottoms</option>
      <option>Outerwear</option>
      <option>Shoes</option>
      <option>Accessories</option>
    </select>
    <button class="add-btn" type="button" id="addBtn">Add</button>
  </div>

  <div id="list"></div>

  <!-- AI stylist: builds outfits from the owned items + suggests what to buy next -->
  <div class="stylist">
    <h2 class="style-h">Stylist</h2>
    <input id="styleIcons" class="style-icons" placeholder="Style icons to emulate — e.g. @ethan_kieffer, @caficosta_" autocomplete="off" />
    <div class="style-row">
      <input id="styleCtx" placeholder="Optional: occasion or weather — e.g. date night, cold" autocomplete="off" />
      <button class="snap-btn" type="button" id="styleBtn">&#10024; Style me</button>
    </div>
    <div class="style-hint" id="styleHint">Build outfit combinations from your wardrobe, in your style icons’ vibe and current trends.</div>
    <div id="styleOut"></div>
  </div>

  <!-- tap any item thumbnail to view the photo enlarged -->
  <div class="lightbox" id="lightbox" hidden></div>

<script>
  var CATS = ['Tops','Bottoms','Outerwear','Shoes','Accessories'];
  var items = []; // { id, name, cat }
  var $ = function(id){ return document.getElementById(id); };

  /* a snapped photo waiting to attach to the next Add: pendingFull is the
     upload candidate (cloud storage removes the closet size cap); pendingThumb
     is the inline fallback used when cloud storage isn't configured. */
  var pendingFull = null, pendingThumb = null, addBusy = false;
  var DEFAULT_ICONS = '@ethan_kieffer, @caficosta_';
  var styleIcons = DEFAULT_ICONS; /* style icons to emulate; persisted with the closet */
  function persist(){
    if(!window.Vitality) return Promise.resolve();
    return window.Vitality.save({ items: items, styleIcons: styleIcons }).catch(function(){
      note('Couldn’t save — your closet may be too large. Remove a few photos.', true);
    });
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function note(msg, isErr){ var h=$('hint'); if(!h) return; h.textContent=msg||''; h.className='snap-hint'+(isErr?' err':''); }

  function render(){
    $('count').textContent = items.length + (items.length===1 ? ' item' : ' items');
    var byCat = {};
    CATS.forEach(function(c){ byCat[c] = []; });
    items.forEach(function(it){ (byCat[it.cat] || (byCat[it.cat] = [])).push(it); });

    var html = '', any = false;
    CATS.forEach(function(cat){
      var list = byCat[cat] || [];
      if(!list.length) return;
      any = true;
      html += '<div class="cat"><div class="cat-h"><span>' + cat + '</span><span>' + list.length + '</span></div>';
      list.forEach(function(it){
        var thumb = it.img ? '<img class="thumb" src="' + it.img + '" alt="" />' : '';
        html += '<div class="item">' + thumb + '<span class="iname">' + esc(it.name) + '</span><button class="x" data-id="' + it.id + '" aria-label="Remove">×</button></div>';
      });
      html += '</div>';
    });
    if(!any){
      html = '<div class="empty">Your closet is empty. Add clothes above to build your wardrobe — then ask <strong>Jarvis</strong> what to wear.</div>';
    }
    $('list').innerHTML = html;
  }

  async function add(){
    if(addBusy) return;
    var name = $('name').value.trim();
    if(!name) return;
    var img = null;
    if(pendingFull){
      /* prefer cloud storage (no size cap); fall back to the inline thumbnail */
      if(window.Vitality && typeof window.Vitality.uploadPhoto === 'function'){
        addBusy = true; $('addBtn').disabled = true; note('Saving photo…');
        var up = null;
        try{ up = await window.Vitality.uploadPhoto(pendingFull); }catch(e){ up = null; }
        addBusy = false; $('addBtn').disabled = false;
        img = (up && up.ok && up.url) ? up.url : pendingThumb;
      } else {
        img = pendingThumb;
      }
    }
    var it = { id: Date.now() + '' + Math.random().toString(36).slice(2,6), name: name, cat: $('cat').value };
    if(img) it.img = img;
    items.push(it);
    $('name').value = '';
    pendingFull = null; pendingThumb = null; showPending(); note('');
    persist(); render();
    $('name').focus();
  }
  $('addBtn').addEventListener('click', add);
  $('name').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); add(); } });

  /* ---- snap a photo → downscale locally → Claude names + categorises it ---- */
  function showPending(){
    var p = $('pending'); if(!p) return;
    if(pendingThumb){
      p.hidden = false;
      p.innerHTML = '<img src="' + pendingThumb + '" alt="" /><span class="pending-txt">Photo attached — edit the name or category, then Add.</span><button type="button" class="pending-x" id="pendingX" aria-label="Discard photo">×</button>';
    } else { p.hidden = true; p.innerHTML = ''; }
  }
  function fileToImage(file){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onload = function(){ var img = new Image(); img.onload = function(){ res(img); }; img.onerror = function(){ rej(new Error('img')); }; img.src = fr.result; };
      fr.onerror = function(){ rej(new Error('read')); };
      fr.readAsDataURL(file);
    });
  }
  function imgToUrl(img, max, q){
    var sc = Math.min(1, max / Math.max(img.width, img.height));
    var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', q);
  }
  async function snap(file){
    if(!(window.Vitality && typeof window.Vitality.identifyClothing === 'function')){
      note('AI identify loads with the dashboard — reload it, then try again.', true); return;
    }
    var img;
    try{ img = await fileToImage(file); }catch(e){ note('Couldn’t read that photo — try again.', true); return; }
    pendingFull = imgToUrl(img, 1024, 0.82);  /* uploaded to cloud storage on Add */
    pendingThumb = imgToUrl(img, 256, 0.7);   /* inline fallback + preview */
    var big = imgToUrl(img, 768, 0.8);        /* larger frame for recognition (not stored) */
    showPending();
    note('Identifying…');
    $('snapBtn').disabled = true;
    var r = null;
    try{ r = await window.Vitality.identifyClothing(big); }catch(e){ r = null; }
    $('snapBtn').disabled = false;
    if(!r || !r.ok){
      var code = r && r.error;
      note(code === 'no_key' ? 'AI identify needs a GEMINI_API_KEY on the server.'
        : code === 'not_clothing' ? 'That didn’t look like a clothing item — name it yourself, then Add.'
        : code === 'rate_limited' ? 'Claude is busy right now — try again in a minute.'
        : code === 'timeout' ? 'That timed out — the photo is attached, name it and Add.'
        : 'Couldn’t identify it — name it yourself, then Add.', true);
      $('name').focus(); return; /* keep the photo attached so it can still be added manually */
    }
    $('name').value = r.item.name || '';
    if(CATS.indexOf(r.item.category) >= 0) $('cat').value = r.item.category;
    note('Identified — edit if needed, then Add.');
    $('name').focus();
  }
  $('snapBtn').addEventListener('click', function(){ var f = $('photoFile'); if(f) f.click(); });
  $('photoFile').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(f) snap(f);
  });
  $('pending').addEventListener('click', function(e){
    if(e.target && e.target.id === 'pendingX'){ pendingFull = null; pendingThumb = null; showPending(); note(''); }
  });

  /* ---- item list: tap a thumbnail to view it larger; × to remove ---- */
  function openLightbox(src){
    var lb = $('lightbox'); if(!lb) return;
    lb.innerHTML = '<img src="' + src + '" alt="" />';
    lb.hidden = false;
  }
  function closeLightbox(){ var lb = $('lightbox'); if(lb){ lb.hidden = true; lb.innerHTML = ''; } }
  $('lightbox').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeLightbox(); });

  /* ---- AI stylist: outfit combos + shopping gaps, grounded in current trends ---- */
  var styleBusy = false;
  function styleNote(msg, isErr){ var h = $('styleHint'); if(!h) return; h.textContent = msg||''; h.className = 'style-hint'+(isErr?' err':''); }
  function renderStyle(style, sources){
    var imgMap = {};
    items.forEach(function(it){ if(it.img) imgMap[String(it.name).toLowerCase()] = it.img; });
    var html = '';
    if(style.note) html += '<div class="style-note">' + esc(style.note) + '</div>';
    var outfits = style.outfits || [];
    if(outfits.length){
      html += '<div class="style-sec">Outfits from your closet</div>';
      outfits.forEach(function(o){
        var chips = (o.items||[]).map(function(n){
          var im = imgMap[String(n).toLowerCase()];
          return im
            ? '<span class="chip hasimg"><img src="' + im + '" alt="" />' + esc(n) + '</span>'
            : '<span class="chip">' + esc(n) + '</span>';
        }).join('');
        html += '<div class="outfit"><div class="outfit-h"><span class="outfit-title">' + esc(o.title) + '</span>'
          + (o.occasion ? '<span class="outfit-occ">' + esc(o.occasion) + '</span>' : '') + '</div>'
          + '<div class="chips">' + chips + '</div>'
          + (o.why ? '<div class="outfit-why">' + esc(o.why) + '</div>' : '') + '</div>';
      });
    }
    var gaps = style.gaps || [];
    if(gaps.length){
      html += '<div class="style-sec">What to buy next</div>';
      gaps.forEach(function(g){ html += '<div class="gap"><b>' + esc(g.item) + '</b><span>' + esc(g.why) + '</span></div>'; });
    }
    if(sources && sources.length){
      var links = sources.filter(function(s){ return s && /^https?:\/\//i.test(s.uri); })
        .map(function(s){ return '<a href="' + esc(s.uri) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title || s.uri) + '</a>'; }).join('');
      if(links) html += '<div class="style-sec">References</div><div class="sources">' + links + '</div>';
    }
    $('styleOut').innerHTML = html;
  }
  async function styleMe(){
    if(styleBusy) return;
    if(!items.length){ styleNote('Add some clothes first — then I can build outfits from them.', true); return; }
    if(!(window.Vitality && typeof window.Vitality.styleCloset === 'function')){
      styleNote('The stylist loads with the dashboard — reload it, then try again.', true); return;
    }
    styleBusy = true; $('styleBtn').disabled = true; $('styleOut').innerHTML = '';
    var icons = $('styleIcons') ? $('styleIcons').value.trim() : styleIcons;
    styleNote(icons ? 'Styling you… searching your style icons + current trends (can take ~15s).' : 'Styling you… searching current trends (can take ~15s).');
    var payload = items.map(function(it){ return { name: it.name, cat: it.cat }; });
    var ctx = $('styleCtx') ? $('styleCtx').value.trim() : '';
    if(icons !== styleIcons){ styleIcons = icons; persist(); } /* remember the icons */
    var r = null;
    try{ r = await window.Vitality.styleCloset(payload, ctx, icons); }catch(e){ r = null; }
    styleBusy = false; $('styleBtn').disabled = false;
    if(!r || !r.ok){
      var code = r && r.error;
      styleNote(code === 'no_key' ? 'The stylist needs a GEMINI_API_KEY on the server.'
        : code === 'empty_closet' ? 'Add some clothes first — then I can style you.'
        : code === 'rate_limited' ? 'The AI is busy right now — try again in a minute.'
        : code === 'timeout' ? 'That took too long — try again.'
        : 'Couldn’t build outfits just now — try again.', true);
      return;
    }
    styleNote('');
    renderStyle(r.style || {}, r.sources || []);
  }
  $('styleBtn').addEventListener('click', styleMe);
  $('styleCtx').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); styleMe(); } });
  $('styleIcons').addEventListener('change', function(){ var v = this.value.trim(); if(v !== styleIcons){ styleIcons = v; persist(); } });
  $('styleOut').addEventListener('click', function(e){
    var img = e.target && e.target.tagName === 'IMG' ? e.target : null;
    if(img && img.getAttribute('src')) openLightbox(img.getAttribute('src'));
  });

  $('list').addEventListener('click', function(e){
    var thumb = e.target.closest ? e.target.closest('.thumb') : null;
    if(thumb){ openLightbox(thumb.getAttribute('src')); return; }
    var b = e.target.closest ? e.target.closest('.x') : null;
    if(!b) return;
    var id = b.getAttribute('data-id');
    var gone = items.filter(function(it){ return it.id === id; })[0];
    /* clean up the cloud copy if this item's photo lives in storage (a URL) */
    if(gone && gone.img && /^https?:/.test(gone.img) && window.Vitality && typeof window.Vitality.deletePhoto === 'function'){
      window.Vitality.deletePhoto(gone.img);
    }
    items = items.filter(function(it){ return it.id !== id; });
    persist(); render();
  });

  (function(){
    var applyIcons = function(){ var el = $('styleIcons'); if(el) el.value = styleIcons; };
    if(!window.Vitality){ applyIcons(); render(); return; }
    window.Vitality.load().then(function(d){
      items = (d && Array.isArray(d.items)) ? d.items : [];
      if(d && typeof d.styleIcons === 'string') styleIcons = d.styleIcons;
      applyIcons(); render();
    }, function(){ applyIcons(); render(); });
  })();
</script>
</body>
</html>
