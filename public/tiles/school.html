<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>School</title>
<style>
  /* Vitality "School" tile — sealed & bridge-backed. Three tabs:
       Tasks    — assignments/exams with due dates, overdue/today/week rollup
       Schedule — a weekly timetable of classes (day · time · room)
       Grades   — per-class averages + an overall GPA on the 4.0 scale
     All state persists through the dashboard bridge (window.Vitality); no
     localStorage, no network. */
  :root{
    color-scheme: dark;
    --bg:#050506; --surface:#0e0e11; --surface-2:#16161b; --surface-3:#1b1b21;
    --fg:#ededf0; --muted:#84848c; --muted-strong:#a8a8b0;
    --border:#1d1d22; --border-strong:#2c2c33;
    --brand:#6EE7B7; --brand-2:#9df3cf; --brand-ink:#04140d;
    --brand-soft:rgba(110,231,183,0.10); --brand-line:rgba(110,231,183,0.32); --brand-glow:rgba(110,231,183,0.42);
    --warn:#FBBF24; --warn-soft:rgba(251,191,36,0.12); --warn-line:rgba(251,191,36,0.32);
    --neg:#ff6b6b; --neg-soft:rgba(255,107,107,0.12); --neg-line:rgba(255,107,107,0.38);
    --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-16:4rem;
    --radius-sm:8px;--radius-md:11px;--radius-lg:18px;--radius-pill:999px;
    --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.375rem;--text-2xl:1.75rem;--text-3xl:2.5rem;
    --ease:cubic-bezier(0.16,1,0.3,1); --dur:200ms;
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{ background:var(--bg); color:var(--fg); font-family:var(--font-ui); font-size:var(--text-base); -webkit-font-smoothing:antialiased; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  @media (max-width:480px){ input,select,textarea{ font-size:16px !important; } }

  .page{ position:relative; min-height:100dvh; padding:var(--space-8) var(--space-5) var(--space-16); isolation:isolate; }
  .page::before{ content:''; position:absolute; inset:0; pointer-events:none; z-index:-1;
    background:radial-gradient(58% 42% at 84% 4%, rgba(110,231,183,0.10), transparent 70%), radial-gradient(48% 40% at 8% 96%, rgba(110,231,183,0.04), transparent 72%); }
  .shell{ max-width:820px; margin:0 auto; }

  .header{ margin-bottom:var(--space-5); }
  .title{ font-family:var(--font-display); font-weight:700; font-size:var(--text-3xl); line-height:1; letter-spacing:-0.03em; margin:0; }
  .subtitle{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.18em; color:var(--muted); margin:6px 0 0; }

  /* Top tabs */
  .tabs{ display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-pill); padding:4px; margin-bottom:var(--space-6); }
  .tabBtn{ flex:1; appearance:none; background:transparent; border:0; color:var(--muted); font-family:var(--font-ui); font-weight:600; font-size:var(--text-sm); padding:9px 10px; border-radius:var(--radius-pill); cursor:pointer; transition:all var(--dur) var(--ease); }
  .tabBtn:hover{ color:var(--muted-strong); }
  .tabBtn.on,.tabBtn.on:hover{ background:var(--brand); color:var(--brand-ink); }

  /* Summary chips (Tasks) */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-3); margin-bottom:var(--space-6); }
  @media (max-width:560px){ .stats{ grid-template-columns:repeat(2,1fr); } }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:var(--space-4); display:flex; flex-direction:column; gap:4px; }
  .stat.hot{ border-color:var(--neg-line); background:var(--neg-soft); }
  .stat.due{ border-color:var(--warn-line); background:var(--warn-soft); }
  .statNum{ font-family:var(--font-display); font-size:var(--text-2xl); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .stat.hot .statNum{ color:var(--neg); } .stat.due .statNum{ color:var(--warn); }
  .statLabel{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }

  /* Add card (shared) */
  .add{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-4); margin-bottom:var(--space-6); display:flex; flex-direction:column; gap:var(--space-3); }
  .addTop{ display:flex; gap:var(--space-3); }
  .addGrid{ display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:var(--space-3); }
  .addGrid.four{ grid-template-columns:1.4fr 1fr 1fr 1fr; }
  @media (max-width:560px){ .addGrid,.addGrid.four{ grid-template-columns:1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.wide{ grid-column:1 / -1; }
  .field label{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); padding-left:2px; }
  input,select{ appearance:none; width:100%; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--fg);
    font-family:var(--font-ui); font-size:var(--text-sm); padding:11px 12px; border-radius:var(--radius-md); outline:none; transition:border-color var(--dur) var(--ease); }
  input::placeholder{ color:var(--muted); }
  input:focus,select:focus{ border-color:var(--brand-line); }
  input[type=date],input[type=time]{ font-family:var(--font-mono); }
  .titleInput{ flex:1; font-size:var(--text-base); }
  .btn{ appearance:none; border:0; cursor:pointer; font-family:var(--font-ui); font-weight:600; font-size:var(--text-sm);
    padding:11px 20px; border-radius:var(--radius-md); background:var(--brand); color:var(--brand-ink); transition:filter var(--dur) var(--ease); white-space:nowrap; }
  .btn:hover{ filter:brightness(1.08); }
  .btnRow{ display:flex; justify-content:flex-end; }

  /* Section head + filter (Tasks) */
  .sectionHead{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-4); }
  .sectionTitle{ font-family:var(--font-display); font-weight:700; font-size:var(--text-xl); letter-spacing:-0.02em; display:inline-flex; align-items:center; gap:10px; }
  .sectionTitle::before{ content:''; width:7px; height:18px; border-radius:3px; background:var(--brand); box-shadow:0 0 12px -2px var(--brand-glow); }
  .seg{ display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-pill); padding:3px; gap:2px; }
  .segBtn{ appearance:none; background:transparent; border:0; color:var(--muted); font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.04em; padding:6px 13px; border-radius:var(--radius-pill); cursor:pointer; transition:all var(--dur) var(--ease); }
  .segBtn:hover{ color:var(--muted-strong); }
  .segBtn.on,.segBtn.on:hover{ background:var(--brand); color:var(--brand-ink); }

  /* Task list */
  .list{ display:flex; flex-direction:column; gap:var(--space-3); }
  .item{ display:flex; align-items:center; gap:var(--space-3); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:var(--space-3) var(--space-4); transition:border-color var(--dur) var(--ease); }
  .item:hover{ border-color:var(--border-strong); }
  .item.overdue{ border-color:var(--neg-line); }
  .item.done{ opacity:.5; }
  .check{ flex:none; width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border-strong); background:var(--surface-2); cursor:pointer; display:grid; place-items:center; transition:all var(--dur) var(--ease); padding:0; }
  .check:hover{ border-color:var(--brand-line); }
  .check.on{ background:var(--brand); border-color:var(--brand); }
  .check svg{ width:13px; height:13px; color:var(--brand-ink); opacity:0; }
  .check.on svg{ opacity:1; }
  .itemMain{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .itemTitle{ font-size:var(--text-sm); font-weight:600; line-height:1.25; word-break:break-word; }
  .item.done .itemTitle{ text-decoration:line-through; }
  .itemMeta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tag{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:0.02em; padding:3px 8px; border-radius:var(--radius-pill); border:1px solid; }
  .type{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .due{ font-family:var(--font-mono); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; margin-left:auto; white-space:nowrap; color:var(--muted-strong); }
  .due.overdue{ color:var(--neg); } .due.today{ color:var(--warn); } .due.soon{ color:var(--brand); }
  .del{ flex:none; appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:6px; border-radius:8px; display:grid; place-items:center; transition:all var(--dur) var(--ease); }
  .del:hover{ color:var(--neg); background:var(--neg-soft); }
  .del svg{ width:15px; height:15px; }

  .empty{ text-align:center; padding:var(--space-10) var(--space-4); color:var(--muted); }
  .empty .big{ font-family:var(--font-display); font-size:var(--text-lg); color:var(--muted-strong); margin-bottom:6px; }
  .empty .small{ font-size:var(--text-sm); }
  .doneHead{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:var(--space-6) 0 var(--space-3); padding-left:2px; }

  /* Schedule */
  .day{ margin-bottom:var(--space-5); }
  .dayName{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 var(--space-3); padding-left:2px; display:flex; align-items:center; gap:8px; }
  .dayName .n{ color:var(--muted); font-weight:600; }
  .today-pill{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.08em; color:var(--brand-ink); background:var(--brand); padding:2px 7px; border-radius:var(--radius-pill); }
  .classRow{ display:flex; align-items:center; gap:var(--space-3); background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--brand); border-radius:var(--radius-md); padding:var(--space-3) var(--space-4); margin-bottom:var(--space-2); }
  .classMain{ flex:1; min-width:0; }
  .className{ font-size:var(--text-sm); font-weight:600; }
  .classRoom{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:2px; }
  .classTime{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--muted-strong); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* Calendar */
  .calHead{ display:flex; align-items:center; gap:8px; margin-bottom:var(--space-4); }
  .calNav{ appearance:none; background:var(--surface); border:1px solid var(--border); color:var(--fg); width:38px; height:38px; border-radius:var(--radius-md); cursor:pointer; font-size:18px; line-height:1; transition:border-color var(--dur) var(--ease); }
  .calNav:hover{ border-color:var(--border-strong); }
  .calTitle{ flex:1; text-align:center; font-family:var(--font-display); font-weight:700; font-size:var(--text-lg); letter-spacing:-0.01em; }
  .calTodayBtn{ appearance:none; background:transparent; border:1px solid var(--brand-line); color:var(--brand); border-radius:var(--radius-pill); padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; transition:background var(--dur) var(--ease); }
  .calTodayBtn:hover{ background:var(--brand-soft); }
  .calDow{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:5px; }
  .calDow span{ text-align:center; font-family:var(--font-mono); font-size:10px; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); }
  .calGrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .calCell{ appearance:none; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); min-height:54px; padding:5px 5px 4px; cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:border-color var(--dur) var(--ease); }
  .calCell:hover{ border-color:var(--border-strong); }
  .calCell.empty{ background:transparent; border-color:transparent; cursor:default; }
  .calCell .cd{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted-strong); font-variant-numeric:tabular-nums; }
  .calCell.today .cd{ color:var(--brand-ink); background:var(--brand); border-radius:6px; width:19px; height:19px; display:grid; place-items:center; font-weight:700; }
  .calCell.selected{ border-color:var(--brand); box-shadow:0 0 0 1px var(--brand-line) inset; }
  .calCell .dots{ display:flex; gap:3px; flex-wrap:wrap; margin-top:auto; }
  .calCell .dot{ width:6px; height:6px; border-radius:50%; }
  .calLegend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:var(--space-4); font-family:var(--font-mono); font-size:10px; color:var(--muted); }
  .calLegend span{ display:inline-flex; align-items:center; gap:6px; }
  .calLegend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .calEmpty{ color:var(--muted); font-size:var(--text-sm); padding:var(--space-3) 2px; }
  .calTop{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-4); }
  .btn.ghost.small{ padding:8px 14px; font-size:12.5px; }
  .dayToggles{ display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--space-1); }
  .dayToggles button{ appearance:none; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--muted); border-radius:var(--radius-pill); padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer; transition:all var(--dur) var(--ease); }
  .dayToggles button.on{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
  .dayHead{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:var(--space-3); padding-left:2px; }
  /* vertical time-grid (day + week) */
  .tgAllday{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:var(--space-4); }
  .evChip{ display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-pill); padding:4px 11px 4px 5px; font-size:12.5px; }
  .tgScroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
  .tgHeadRow{ display:flex; gap:6px; margin-bottom:6px; width:max-content; }
  .tgGutterHead{ width:52px; flex:none; }
  .tgHead{ width:112px; flex:none; text-align:center; }
  .tgHDow{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); }
  .tgHDate{ display:block; font-family:var(--font-display); font-weight:700; font-size:15px; margin-top:1px; }
  .tgHDots{ display:inline-flex; gap:3px; margin-top:3px; min-height:6px; }
  .tgHead.today .tgHDow,.tgHead.today .tgHDate{ color:var(--brand); }
  .tgWrap{ display:flex; gap:6px; width:100%; }
  .tgScroll .tgWrap{ width:max-content; }
  .tgGutter{ position:relative; width:52px; flex:none; }
  .tgHr{ position:absolute; right:8px; transform:translateY(-50%); font-family:var(--font-mono); font-size:10px; color:var(--muted); white-space:nowrap; }
  .tgCols{ display:flex; gap:6px; }
  .tgCols.one{ flex:1; }
  .tgCols.one .tgCol{ flex:1; }
  .tgCols.week .tgCol{ width:112px; flex:none; }
  .tgCol{ position:relative; border:1px solid var(--border); border-radius:var(--radius-sm); }
  .tgBlock{ position:absolute; left:3px; right:3px; border:1px solid var(--border); border-left-width:3px; border-radius:7px; padding:5px 8px; overflow:hidden; display:flex; flex-direction:column; gap:1px; }
  .tgName{ font-size:12px; font-weight:600; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tgMeta{ font-family:var(--font-mono); font-size:9.5px; color:var(--muted-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tgDel{ position:absolute; top:2px; right:2px; appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:3px; border-radius:5px; opacity:.65; }
  .tgDel svg{ width:13px; height:13px; }
  .tgDel:hover{ color:var(--neg); opacity:1; }

  /* Grades */
  .gpaHero{ display:flex; gap:var(--space-4); margin-bottom:var(--space-6); }
  .gpaCard{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-5); text-align:center; }
  .gpaCard.accent{ border-color:var(--brand-line); background:var(--brand-soft); }
  .gpaNum{ font-family:var(--font-display); font-size:2.4rem; font-weight:700; line-height:1; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
  .gpaCard.accent .gpaNum{ color:var(--brand); }
  .gpaLbl{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-top:6px; }
  .gradeClass{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:var(--space-4); margin-bottom:var(--space-3); }
  .gradeClassHead{ display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-3); }
  .gcName{ font-size:var(--text-base); font-weight:700; letter-spacing:-0.01em; }
  .gcAvg{ margin-left:auto; display:flex; align-items:baseline; gap:8px; }
  .gcPct{ font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums; }
  .gcLetter{ font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:var(--radius-pill); border:1px solid var(--brand-line); color:var(--brand); }
  .gradeItem{ display:flex; align-items:center; gap:var(--space-3); padding:8px 0; border-top:1px solid var(--border); }
  .giTitle{ flex:1; min-width:0; font-size:var(--text-sm); color:var(--muted-strong); word-break:break-word; }
  .giScore{ font-family:var(--font-mono); font-size:12px; font-variant-numeric:tabular-nums; color:var(--fg); white-space:nowrap; }

  /* Import */
  .importBar{ display:flex; align-items:center; gap:var(--space-3); background:var(--surface); border:1px dashed var(--border-strong); border-radius:var(--radius-lg); padding:var(--space-4) var(--space-5); margin-bottom:var(--space-6); }
  .importBar .txt{ flex:1; min-width:0; }
  .importBar .t{ font-weight:600; font-size:var(--text-sm); }
  .importBar .s{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .btn.ghost{ background:transparent; color:var(--brand); border:1px solid var(--brand-line); }
  .btn.ghost:hover{ background:var(--brand-soft); filter:none; }

  /* Lectures timeline */
  .courseCard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-4) var(--space-5); margin-bottom:var(--space-4); }
  .courseHead{ display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-3); padding-bottom:var(--space-3); border-bottom:1px solid var(--border); }
  .courseName{ font-family:var(--font-display); font-weight:700; font-size:var(--text-lg); letter-spacing:-0.01em; }
  .courseCount{ margin-left:auto; font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .tl{ display:flex; align-items:center; gap:var(--space-3); padding:8px 0; }
  .tl+.tl{ border-top:1px solid rgba(255,255,255,0.03); }
  .tlDate{ flex:none; width:58px; font-family:var(--font-mono); font-size:11px; font-variant-numeric:tabular-nums; color:var(--muted-strong); }
  .tlDate.past{ color:var(--muted); opacity:.6; }
  .tlTitle{ flex:1; min-width:0; font-size:var(--text-sm); word-break:break-word; }
  .kind{ flex:none; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:3px 8px; border-radius:var(--radius-pill); border:1px solid; }
  .kind.lecture{ color:var(--muted); border-color:var(--border-strong); }
  .kind.quiz{ color:var(--warn); border-color:var(--warn-line); background:var(--warn-soft); }
  .kind.exam{ color:var(--neg); border-color:var(--neg-line); background:var(--neg-soft); }
  .kind.assignment{ color:var(--brand); border-color:var(--brand-line); background:var(--brand-soft); }
  .rowbtn{ flex:none; appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:5px 8px; border-radius:7px; font-size:14px; line-height:1; transition:all var(--dur) var(--ease); }
  .rowbtn:hover{ color:var(--brand); background:var(--brand-soft); }
  .rowbtn.danger:hover{ color:var(--neg); background:var(--neg-soft); }
  .rowbtn.danger svg{ width:15px; height:15px; }
  .courseHead.editing,.courseHead.deleting{ flex-wrap:wrap; gap:8px; }
  .courseHead .delMsg{ flex:1; min-width:180px; font-size:var(--text-sm); color:var(--muted-strong); }
  .btn.danger{ background:var(--neg); color:#160404; }
  .btn.danger:hover{ filter:brightness(1.05); }
  .courseHead .edCourse{ flex:1; min-width:180px; padding:9px 11px; font-weight:600; font-size:var(--text-base); }
  .tl.editing{ flex-wrap:wrap; gap:8px; }
  .tl .edTitle{ flex:1; min-width:150px; padding:9px 11px; }
  .tl .edKind{ flex:none; width:128px; padding:9px 11px; }
  .tl .edDate{ flex:none; width:150px; padding:9px 11px; font-family:var(--font-mono); }
  .btn.small{ padding:9px 15px; font-size:12.5px; }

  /* Overlays */
  .overlay{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:var(--space-5); background:rgba(3,3,4,0.78); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .spinner{ width:44px; height:44px; border-radius:50%; border:3px solid var(--surface-3); border-top-color:var(--brand); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loadCard{ display:flex; flex-direction:column; align-items:center; gap:var(--space-4); color:var(--muted-strong); font-size:var(--text-sm); text-align:center; }
  .modal{ width:min(560px,100%); max-height:86dvh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius-lg); overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .modalHead{ padding:var(--space-5); border-bottom:1px solid var(--border); }
  .modalTitle{ font-family:var(--font-display); font-weight:700; font-size:var(--text-xl); letter-spacing:-0.02em; }
  .modalSub{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .modalBody{ padding:var(--space-4) var(--space-5); overflow-y:auto; }
  .revRow{ display:flex; align-items:center; gap:var(--space-3); padding:7px 0; border-top:1px solid var(--border); }
  .revRow:first-child{ border-top:0; }
  .modalFoot{ display:flex; gap:var(--space-3); padding:var(--space-4) var(--space-5); border-top:1px solid var(--border); }
  .modalFoot .btn{ flex:1; }
  .btn.sub{ background:transparent; color:var(--fg); border:1px solid var(--border-strong); }
  .btn.sub:hover{ filter:none; background:var(--surface-2); }
  .errNote{ color:var(--neg); font-size:var(--text-sm); text-align:center; }
</style>
</head>
<body>
<div class="page">
  <div class="shell">
    <div class="header">
      <h1 class="title">School</h1>
      <p class="subtitle" id="subtitle">Assignments &amp; deadlines</p>
    </div>

    <div class="tabs" id="tabs">
      <button class="tabBtn on" data-tab="tasks" type="button">Tasks</button>
      <button class="tabBtn" data-tab="lectures" type="button">Lectures</button>
      <button class="tabBtn" data-tab="schedule" type="button">Schedule</button>
      <button class="tabBtn" data-tab="grades" type="button">Grades</button>
    </div>

    <!-- ============ TASKS ============ -->
    <div id="panel-tasks">
      <div class="stats" id="stats"></div>
      <div class="add">
        <div class="addTop">
          <input class="titleInput" id="fTitle" type="text" placeholder="Add an assignment, exam or project…" maxlength="140" />
          <button class="btn" id="addBtn" type="button">Add</button>
        </div>
        <div class="addGrid">
          <div class="field">
            <label for="fClass">Class</label>
            <input id="fClass" type="text" list="classes" placeholder="e.g. Biology" maxlength="40" />
          </div>
          <div class="field">
            <label for="fType">Type</label>
            <select id="fType">
              <option>Homework</option><option>Exam</option><option>Project</option>
              <option>Quiz</option><option>Reading</option><option>Essay</option>
            </select>
          </div>
          <div class="field">
            <label for="fDue">Due</label>
            <input id="fDue" type="date" />
          </div>
        </div>
      </div>
      <div class="sectionHead">
        <span class="sectionTitle" id="secTitle">To do</span>
        <div class="seg" id="filter">
          <button class="segBtn on" data-f="todo" type="button">To do</button>
          <button class="segBtn" data-f="done" type="button">Done</button>
          <button class="segBtn" data-f="all" type="button">All</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>

    <!-- ============ LECTURES ============ -->
    <div id="panel-lectures" hidden>
      <div class="importBar">
        <div class="txt">
          <div class="t">Import a syllabus</div>
          <div class="s">Snap or upload screenshots of a class schedule — I'll pull out the lectures, quiz &amp; exam dates.</div>
        </div>
        <button class="btn ghost" id="importBtn" type="button">⇪ Import</button>
      </div>
      <div id="lectures"></div>
    </div>

    <!-- ============ SCHEDULE (calendar) ============ -->
    <div id="panel-schedule" hidden>
      <div class="calTop">
        <div class="seg" id="calViews">
          <button class="segBtn" data-v="day" type="button">Day</button>
          <button class="segBtn on" data-v="week" type="button">Week</button>
          <button class="segBtn" data-v="month" type="button">Month</button>
        </div>
        <button class="btn ghost small" id="addClassBtn" type="button">＋ Class</button>
      </div>

      <div class="add" id="addClassForm" hidden>
        <div class="addGrid four">
          <div class="field wide"><label for="mName">Class</label><input id="mName" type="text" list="classes" placeholder="e.g. Cannabis in Pharmacy" maxlength="60" /></div>
          <div class="field"><label for="mStart">Start</label><input id="mStart" type="time" /></div>
          <div class="field"><label for="mEnd">End</label><input id="mEnd" type="time" /></div>
          <div class="field"><label for="mRoom">Room / note</label><input id="mRoom" type="text" placeholder="PH-130" maxlength="40" /></div>
        </div>
        <div class="dayToggles" id="mDays">
          <button data-d="1" type="button">Mon</button><button data-d="2" type="button">Tue</button><button data-d="3" type="button">Wed</button><button data-d="4" type="button">Thu</button><button data-d="5" type="button">Fri</button><button data-d="6" type="button">Sat</button><button data-d="0" type="button">Sun</button>
        </div>
        <div class="btnRow"><button class="btn sub small" id="mCancel" type="button">Cancel</button><button class="btn small" id="mAdd" type="button">Add class</button></div>
      </div>

      <div class="calHead">
        <button class="calNav" id="calPrev" type="button" aria-label="Previous">‹</button>
        <div class="calTitle" id="calTitle"></div>
        <button class="calNav" id="calNext" type="button" aria-label="Next">›</button>
        <button class="calTodayBtn" id="calToday" type="button">Today</button>
      </div>
      <div id="calBody"></div>
      <div class="calLegend">
        <span><i style="background:#84848c"></i>Lecture</span>
        <span><i style="background:#FBBF24"></i>Quiz</span>
        <span><i style="background:#ff6b6b"></i>Exam</span>
        <span><i style="background:#6EE7B7"></i>Assignment</span>
      </div>
    </div>

    <!-- ============ GRADES ============ -->
    <div id="panel-grades" hidden>
      <div class="gpaHero" id="gpaHero"></div>
      <div class="add">
        <div class="addGrid four">
          <div class="field">
            <label for="gClass">Class</label>
            <input id="gClass" type="text" list="classes" placeholder="Biology" maxlength="40" />
          </div>
          <div class="field wide" style="grid-column:auto">
            <label for="gTitle">Item</label>
            <input id="gTitle" type="text" placeholder="Test 2, Lab 4…" maxlength="60" />
          </div>
          <div class="field">
            <label for="gEarned">Earned</label>
            <input id="gEarned" type="number" inputmode="decimal" placeholder="88" min="0" step="0.01" />
          </div>
          <div class="field">
            <label for="gTotal">Out of</label>
            <input id="gTotal" type="number" inputmode="decimal" placeholder="100" min="0" step="0.01" />
          </div>
        </div>
        <div class="btnRow"><button class="btn" id="gAdd" type="button">Add grade</button></div>
      </div>
      <div id="grades"></div>
    </div>

    <datalist id="classes"></datalist>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden />

<div class="overlay" id="importLoading" hidden>
  <div class="loadCard">
    <div class="spinner"></div>
    <div id="loadMsg">Reading your syllabus…</div>
  </div>
</div>

<div class="overlay" id="reviewModal" hidden>
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle" id="revTitle">Review import</div>
      <div class="modalSub" id="revSub"></div>
    </div>
    <div class="modalBody" id="revBody"></div>
    <div class="modalFoot">
      <button class="btn sub" id="revCancel" type="button">Cancel</button>
      <button class="btn" id="revConfirm" type="button">Add to School</button>
    </div>
  </div>
</div>

<script>
(function(){
  var SUBJECT_COLORS = ['#6EE7B7','#7CB8FF','#F6A5C0','#FBBF24','#C4A5F6','#5EE6D0','#FF9F6E','#B7E36E'];
  var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var state = { items: [], classes: [], grades: [], lectures: [] };
  var tab = 'tasks';
  var pendingImport = null;
  var filter = 'todo';
  var saveT = null;

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function colorFor(name){ if(!name) return 'var(--muted)'; var h=0; for(var i=0;i<name.length;i++){ h=(h*31+name.charCodeAt(i))>>>0; } return SUBJECT_COLORS[h % SUBJECT_COLORS.length]; }

  // ---- dates ----
  function todayMid(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function parseDue(s){ if(!s) return null; var p=s.split('-'); if(p.length!==3) return null; var d=new Date(+p[0], +p[1]-1, +p[2]); d.setHours(0,0,0,0); return d; }
  function daysUntil(s){ var d=parseDue(s); if(!d) return null; return Math.round((d - todayMid())/86400000); }
  function dueLabel(s){
    var n=daysUntil(s);
    if(n===null) return {text:'No date', cls:''};
    if(n<0) return {text:n===-1?'Overdue 1 day':'Overdue '+(-n)+' days', cls:'overdue'};
    if(n===0) return {text:'Due today', cls:'today'};
    if(n===1) return {text:'Tomorrow', cls:'soon'};
    if(n<=6) return {text:'In '+n+' days', cls:'soon'};
    return {text: parseDue(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}), cls:''};
  }
  function fmtTime(t){ // "14:30" -> "2:30 PM"
    if(!t) return ''; var p=t.split(':'); if(p.length<2) return t;
    var h=+p[0], m=p[1]; var ap=h>=12?'PM':'AM'; var hh=h%12; if(hh===0) hh=12;
    return hh+':'+m+' '+ap;
  }
  // JS getDay: 0=Sun..6=Sat -> our index 0=Mon..6=Sun
  function todayIdx(){ var d=new Date().getDay(); return d===0?6:d-1; }

  // ---- grade helpers ----
  function letterGpa(pct){
    if(pct>=93) return ['A',4.0]; if(pct>=90) return ['A-',3.7];
    if(pct>=87) return ['B+',3.3]; if(pct>=83) return ['B',3.0]; if(pct>=80) return ['B-',2.7];
    if(pct>=77) return ['C+',2.3]; if(pct>=73) return ['C',2.0]; if(pct>=70) return ['C-',1.7];
    if(pct>=67) return ['D+',1.3]; if(pct>=63) return ['D',1.0]; if(pct>=60) return ['D-',0.7];
    return ['F',0.0];
  }

  // ---- persistence ----
  function persist(){
    if(saveT) clearTimeout(saveT);
    saveT = setTimeout(function(){ try { window.Vitality && window.Vitality.save(state); } catch(e){} }, 250);
  }

  function refreshClasses(){
    var subs = {};
    state.classes.forEach(function(c){ if(c.name) subs[c.name]=1; });
    state.items.forEach(function(it){ if(it.subject) subs[it.subject]=1; });
    state.grades.forEach(function(g){ if(g.cls) subs[g.cls]=1; });
    state.lectures.forEach(function(l){ if(l.cls) subs[l.cls]=1; });
    (state.meetings||[]).forEach(function(m){ if(m.name) subs[m.name]=1; });
    $('classes').innerHTML = Object.keys(subs).map(function(s){ return '<option value="'+esc(s)+'">'; }).join('');
  }
  function fmtDate(s){ var d=parseDue(s); return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''; }

  // ============ TASKS ============
  function addTask(){
    var title=$('fTitle').value.trim(); if(!title){ $('fTitle').focus(); return; }
    state.items.push({ id:uid(), title:title, subject:$('fClass').value.trim(), type:$('fType').value, due:$('fDue').value||'', done:false, createdAt:Date.now() });
    $('fTitle').value=''; $('fClass').value=''; $('fDue').value=''; $('fTitle').focus();
    persist(); renderTasks(); refreshClasses();
  }
  function toggleTask(id){ var it=state.items.find(function(x){return x.id===id;}); if(it){ it.done=!it.done; it.doneAt=it.done?Date.now():null; persist(); renderTasks(); } }
  function delTask(id){ state.items=state.items.filter(function(x){return x.id!==id;}); persist(); renderTasks(); }
  function sortTodo(a,b){ var da=daysUntil(a.due), db=daysUntil(b.due); if(da===null&&db===null) return a.createdAt-b.createdAt; if(da===null) return 1; if(db===null) return -1; return da-db; }

  function renderStats(){
    var overdue=0,today=0,week=0,done=0;
    state.items.forEach(function(it){ if(it.done){done++;return;} var n=daysUntil(it.due); if(n===null) return; if(n<0) overdue++; else if(n===0){today++;week++;} else if(n<=6) week++; });
    var chips=[{num:overdue,label:'Overdue',cls:overdue>0?'hot':''},{num:today,label:'Due today',cls:today>0?'due':''},{num:week,label:'This week',cls:''},{num:done,label:'Done',cls:''}];
    $('stats').innerHTML = chips.map(function(c){ return '<div class="stat '+c.cls+'"><span class="statNum">'+c.num+'</span><span class="statLabel">'+c.label+'</span></div>'; }).join('');
  }
  function taskHtml(it){
    var dl=dueLabel(it.due), col=colorFor(it.subject);
    var tag=it.subject?'<span class="tag" style="color:'+col+';border-color:'+col+'55;background:'+col+'14">'+esc(it.subject)+'</span>':'';
    return '<div class="item '+(it.done?'done':'')+' '+(!it.done&&dl.cls==='overdue'?'overdue':'')+'">'
      +'<button class="check '+(it.done?'on':'')+'" data-act="toggle" data-id="'+it.id+'" aria-label="Toggle done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></button>'
      +'<div class="itemMain"><span class="itemTitle">'+esc(it.title)+'</span><span class="itemMeta">'+tag+'<span class="type">'+esc(it.type||'')+'</span></span></div>'
      +'<span class="due '+(it.done?'':dl.cls)+'">'+esc(dl.text)+'</span>'
      +'<button class="del" data-act="del" data-id="'+it.id+'" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div>';
  }
  function renderTasks(){
    renderStats();
    $('secTitle').textContent = filter==='done'?'Completed':filter==='all'?'All assignments':'To do';
    var todo=state.items.filter(function(x){return !x.done;}).sort(sortTodo);
    var done=state.items.filter(function(x){return x.done;}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
    var html='';
    if(filter==='todo') html = todo.length?todo.map(taskHtml).join(''):'<div class="empty"><div class="big">All clear ✓</div><div class="small">No assignments to do. Add one above.</div></div>';
    else if(filter==='done') html = done.length?done.map(taskHtml).join(''):'<div class="empty"><div class="big">Nothing completed yet</div><div class="small">Tick things off as you finish them.</div></div>';
    else { if(!state.items.length) html='<div class="empty"><div class="big">No assignments yet</div><div class="small">Add your first one above to start tracking deadlines.</div></div>'; else { html=todo.map(taskHtml).join(''); if(done.length) html+='<div class="doneHead">Completed · '+done.length+'</div>'+done.map(taskHtml).join(''); } }
    $('list').innerHTML=html;
  }

  // ============ SCHEDULE (Day / Week / Month calendar) ============
  var calView = 'week', calSel = null;
  var KIND_COL = { lecture:'#84848c', quiz:'#FBBF24', exam:'#ff6b6b', assignment:'#6EE7B7' };
  function pad2(n){ return (n<10?'0':'')+n; }
  function isoOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function weekStart(d){ var x=new Date(d); var dow=x.getDay(); x.setDate(x.getDate()+(dow===0?-6:1-dow)); x.setHours(0,0,0,0); return x; } // Monday

  function buildEvents(){
    var map = {};
    function add(date, ev){ if(date) (map[date]||(map[date]=[])).push(ev); }
    state.lectures.forEach(function(l){ add(l.date, { kind:'lecture', title:l.title, cls:l.cls }); });
    state.items.forEach(function(it){
      if(!it.due) return; var k=(it.type||'').toLowerCase();
      if(k==='quiz'||k==='exam'||k==='assignment') add(it.due, { kind:k, title:it.title, cls:it.subject });
    });
    return map;
  }
  function meetingsForDow(dow){
    return state.meetings.filter(function(m){ return m.days && m.days.indexOf(dow)>=0; })
      .slice().sort(function(a,b){ return (a.start||'').localeCompare(b.start||''); });
  }

  function initCal(){ if(calSel===null) calSel = isoOf(todayMid()); }

  function renderSchedule(){ // dispatch by view (name kept so setTab wiring is unchanged)
    initCal();
    Array.prototype.forEach.call($('calViews').children, function(b){ b.classList.toggle('on', b.getAttribute('data-v')===calView); });
    var d = parseDue(calSel);
    if(calView==='month') $('calTitle').textContent = d.toLocaleDateString('en-US',{ month:'long', year:'numeric' });
    else if(calView==='day') $('calTitle').textContent = d.toLocaleDateString('en-US',{ weekday:'long', month:'long', day:'numeric' });
    else { var mon=weekStart(d), sun=new Date(mon); sun.setDate(mon.getDate()+6);
      var sm=mon.getMonth()===sun.getMonth();
      $('calTitle').textContent = mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+sun.toLocaleDateString('en-US', sm?{day:'numeric'}:{month:'short',day:'numeric'}); }
    if(calView==='month') renderMonth(d);
    else if(calView==='day') renderDay(d);
    else renderWeek(d);
  }

  // ---- vertical time-grid (Day + Week views) ----
  var HOUR_PX = 54;
  function toMin(t){ if(!t) return null; var p=String(t).split(':'); if(p.length<2) return null; return (+p[0])*60+(+p[1]); }
  function fmtHour(h){ var ap=h>=12?'PM':'AM'; var hr=h%12; if(hr===0) hr=12; return hr+' '+ap; }
  function gridRange(){
    var minM=8*60, maxM=18*60;
    state.meetings.forEach(function(m){ var s=toMin(m.start), e=toMin(m.end); if(s!=null) minM=Math.min(minM,s); if(e!=null) maxM=Math.max(maxM,e); });
    var startH=Math.floor(minM/60); return { startH:startH, endH:Math.max(Math.ceil(maxM/60), startH+1) };
  }
  function hourLabels(r){ var s=''; for(var h=r.startH; h<=r.endH; h++) s+='<span class="tgHr" style="top:'+((h-r.startH)*HOUR_PX)+'px">'+fmtHour(h)+'</span>'; return s; }
  function gridBg(){ return 'background-image:repeating-linear-gradient(to bottom, transparent 0, transparent '+(HOUR_PX-1)+'px, rgba(150,220,190,.06) '+(HOUR_PX-1)+'px, rgba(150,220,190,.06) '+HOUR_PX+'px);'; }
  function colBlocks(d, r){
    return meetingsForDow(d.getDay()).filter(function(m){ return m.start; }).map(function(m){
      var col=colorFor(m.name), s=toMin(m.start), e=toMin(m.end)||(s+60);
      var top=(s-r.startH*60)/60*HOUR_PX, hgt=Math.max(30,(e-s)/60*HOUR_PX);
      var t=fmtTime(m.start)+(m.end?'–'+fmtTime(m.end):'');
      return '<div class="tgBlock" style="top:'+top+'px;height:'+hgt+'px;border-left-color:'+col+';background:'+col+'22">'
        +'<span class="tgName">'+esc(m.name)+'</span><span class="tgMeta">'+esc(t)+(m.room?' · '+esc(m.room):'')+'</span>'
        +'<button class="tgDel" data-act="delmeet" data-id="'+m.id+'" aria-label="Remove">'+delSvg+'</button></div>';
    }).join('');
  }
  function chipHtml(e){ var col=colorFor(e.cls); return '<span class="evChip"><span class="kind '+e.kind+'">'+e.kind+'</span>'+esc(e.title)+(e.cls?' <b style="color:'+col+';font-weight:600">'+esc(e.cls)+'</b>':'')+'</span>'; }

  function renderDay(d){
    var r=gridRange(), h=(r.endH-r.startH)*HOUR_PX, evts=buildEvents(), ds=isoOf(d);
    var un=evts[ds]||[]; var allday = un.length?'<div class="tgAllday">'+un.map(chipHtml).join('')+'</div>':'';
    $('calBody').innerHTML = '<div class="dayHead">'+esc(d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))+'</div>'
      + allday
      + '<div class="tgWrap"><div class="tgGutter" style="height:'+h+'px">'+hourLabels(r)+'</div>'
      + '<div class="tgCols one"><div class="tgCol" style="height:'+h+'px;'+gridBg()+'">'+colBlocks(d,r)+'</div></div></div>';
  }
  function renderWeek(d){
    var mon=weekStart(d), r=gridRange(), h=(r.endH-r.startH)*HOUR_PX, evts=buildEvents(), todayStr=isoOf(todayMid());
    var heads='', cols='';
    for(var i=0;i<7;i++){ var dd=new Date(mon); dd.setDate(mon.getDate()+i); var isT=isoOf(dd)===todayStr;
      var un=evts[isoOf(dd)]||[];
      var dots=un.slice(0,4).map(function(e){ return '<span class="dot" style="background:'+KIND_COL[e.kind]+'"></span>'; }).join('');
      heads += '<div class="tgHead'+(isT?' today':'')+'"><span class="tgHDow">'+dd.toLocaleDateString('en-US',{weekday:'short'})+'</span><span class="tgHDate">'+dd.getDate()+'</span><span class="tgHDots">'+dots+'</span></div>';
      cols += '<div class="tgCol" style="height:'+h+'px;'+gridBg()+'">'+colBlocks(dd,r)+'</div>';
    }
    $('calBody').innerHTML = '<div class="tgScroll"><div class="tgHeadRow"><div class="tgGutterHead"></div>'+heads+'</div>'
      + '<div class="tgWrap"><div class="tgGutter" style="height:'+h+'px">'+hourLabels(r)+'</div><div class="tgCols week">'+cols+'</div></div></div>';
  }
  function renderMonth(anchor){
    var Y=anchor.getFullYear(), M=anchor.getMonth(), evts=buildEvents();
    var first=new Date(Y,M,1), startDow=first.getDay(), dim=new Date(Y,M+1,0).getDate(), todayStr=isoOf(todayMid());
    var cells=[]; for(var i=0;i<startDow;i++) cells.push(null);
    for(var dd=1; dd<=dim; dd++) cells.push(dd);
    while(cells.length%7!==0) cells.push(null);
    var grid = cells.map(function(day){
      if(day===null) return '<div class="calCell empty"></div>';
      var ds=Y+'-'+pad2(M+1)+'-'+pad2(day), dow=new Date(Y,M,day).getDay(), dots=[];
      meetingsForDow(dow).forEach(function(m){ dots.push(colorFor(m.name)); });
      (evts[ds]||[]).forEach(function(e){ dots.push(KIND_COL[e.kind]); });
      var dh=dots.slice(0,5).map(function(c){ return '<span class="dot" style="background:'+c+'"></span>'; }).join('');
      var c='calCell'+(ds===todayStr?' today':'')+(ds===calSel?' selected':'');
      return '<button type="button" class="'+c+'" data-date="'+ds+'"><span class="cd">'+day+'</span><span class="dots">'+dh+'</span></button>';
    }).join('');
    $('calBody').innerHTML = '<div class="calDow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calGrid">'+grid+'</div>';
  }

  // ============ GRADES ============
  function addGrade(){
    var cls=$('gClass').value.trim(), title=$('gTitle').value.trim();
    var earned=parseFloat($('gEarned').value), total=parseFloat($('gTotal').value);
    if(!cls){ $('gClass').focus(); return; }
    if(!(total>0) || isNaN(earned)){ $('gEarned').focus(); return; }
    state.grades.push({ id:uid(), cls:cls, title:title||'Grade', earned:earned, total:total, createdAt:Date.now() });
    $('gTitle').value=''; $('gEarned').value=''; $('gTotal').value=''; $('gTitle').focus();
    persist(); renderGrades(); refreshClasses();

  function delGrade(id){ state.grades=state.grades.filter(function(x){return x.id!==id;}); persist(); renderGrades(); }
  function renderGrades(){
    var byClass={};
    state.grades.forEach(function(g){ (byClass[g.cls]||(byClass[g.cls]=[])).push(g); });
    var names=Object.keys(byClass);
    // per-class pct + overall gpa (equal-weight per class)
    var gpaSum=0, gpaN=0, pctSum=0, pctN=0;
    var classInfo={};
    names.forEach(function(n){
      var e=0,t=0; byClass[n].forEach(function(g){ e+=g.earned; t+=g.total; });
      var pct = t>0 ? (e/t*100) : 0;
      var lg = letterGpa(pct);
      classInfo[n]={pct:pct, letter:lg[0], gpa:lg[1]};
      gpaSum+=lg[1]; gpaN++; pctSum+=pct; pctN++;
    });
    var gpa = gpaN? (gpaSum/gpaN):null;
    var avg = pctN? (pctSum/pctN):null;
    $('gpaHero').innerHTML =
      '<div class="gpaCard accent"><div class="gpaNum">'+(gpa!=null?gpa.toFixed(2):'—')+'</div><div class="gpaLbl">GPA · 4.0 scale</div></div>'
     +'<div class="gpaCard"><div class="gpaNum">'+(avg!=null?Math.round(avg)+'%':'—')+'</div><div class="gpaLbl">Overall average</div></div>'
     +'<div class="gpaCard"><div class="gpaNum">'+names.length+'</div><div class="gpaLbl">Classes graded</div></div>';

    if(!names.length){ $('grades').innerHTML='<div class="empty"><div class="big">No grades yet</div><div class="small">Add graded items above to see class averages and your GPA.</div></div>'; return; }
    names.sort();
    $('grades').innerHTML = names.map(function(n){
      var ci=classInfo[n], col=colorFor(n);
      var items=byClass[n].slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});

        +'<span class="gcAvg"><span class="gcPct" style="color:'+col+'">'+Math.round(ci.pct)+'%</span><span class="gcLetter">'+ci.letter+'</span></span></div>'
        +items.map(function(g){
          return '<div class="gradeItem"><span class="giTitle">'+esc(g.title)+'</span><span class="giScore">'+g.earned+' / '+g.total+'</span>'
            +'<button class="del" data-act="delgrade" data-id="'+g.id+'" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div>';
        }).join('')+'</div>';
    }).join('');
  }

  // ============ LECTURES (course timeline) ============
  var editingRow = null; // { src:'lecture'|'item', id }
  var editingCourse = null; // class name being renamed
  var deletingCourse = null; // class name pending delete-confirm

  function renderLectures(){
    // Build a per-class timeline from lectures + the dated quiz/exam/assignment tasks.
    var byClass = {};
    function ensure(c){ return byClass[c] || (byClass[c] = []); }
    state.lectures.forEach(function(l){ if(l.cls) ensure(l.cls).push({ src:'lecture', id:l.id, date:l.date, title:l.title, kind:'lecture' }); });
    state.items.forEach(function(it){
      if(!it.subject || !it.due) return;
      var t=(it.type||'').toLowerCase();
      if(t==='quiz'||t==='exam'||t==='assignment') ensure(it.subject).push({ src:'item', id:it.id, date:it.due, title:it.title, kind:t });
    });
    var names = Object.keys(byClass);
    if(!names.length){
      $('lectures').innerHTML = '<div class="empty"><div class="big">No courses imported yet</div><div class="small">Tap Import above and add screenshots of a syllabus — your lectures, quizzes and exams will land here.</div></div>';
      return;
    }
    names.sort();
    var todayS = todayMid().getTime();
    $('lectures').innerHTML = names.map(function(n){
      var col = colorFor(n);
      var rows = byClass[n].slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
      var lc = rows.filter(function(r){return r.kind==='lecture';}).length;
      return '<div class="courseCard">'+courseHead(n, col, lc)

    }).join('');

  function deleteCourse(name){

    state.lectures = state.lectures.filter(function(l){ return l.cls!==name; });
    state.items = state.items.filter(function(it){ return it.subject!==name; });

  function renameCourse(oldName, newName){
    newName = (newName||'').trim();
    editingCourse = null;
    if(newName && newName!==oldName){
      state.lectures.forEach(function(l){ if(l.cls===oldName) l.cls=newName; });
      state.items.forEach(function(it){ if(it.subject===oldName) it.subject=newName; });
      state.grades.forEach(function(g){ if(g.cls===oldName) g.cls=newName; });
      state.classes.forEach(function(c){ if(c.name===oldName) c.name=newName; });
      persist(); refreshClasses();
    }
    renderLectures();

  function rowHtml(r, todayS){
    if(editingRow && editingRow.src===r.src && editingRow.id===r.id){

      return '<div class="tl editing">'
        + '<input class="edTitle" type="text" value="'+esc(r.title)+'" maxlength="160" />'

        + '<input class="edDate" type="date" value="'+esc(r.date)+'" />'
        + '<button class="btn small" data-act="lsave" data-src="'+r.src+'" data-id="'+r.id+'" type="button">Save</button>'
        + '<button class="btn sub small" data-act="lcancel" type="button">Cancel</button>'
        + '</div>';
    }
    var past = parseDue(r.date) && parseDue(r.date).getTime() < todayS;
    return '<div class="tl">'
      + '<span class="tlDate'+(past?' past':'')+'">'+esc(fmtDate(r.date))+'</span>'
      + '<span class="tlTitle">'+esc(r.title)+'</span>'
      + '<span class="kind '+r.kind+'">'+r.kind+'</span>'
      + '<button class="rowbtn" data-act="ledit" data-src="'+r.src+'" data-id="'+r.id+'" aria-label="Edit">✎</button>'
      + '<button class="del" data-act="ldel" data-src="'+r.src+'" data-id="'+r.id+'" aria-label="Delete">'+delSvg+'</button>'

  function findRow(src, id){
    return src==='lecture'
      ? state.lectures.find(function(x){ return x.id===id; })
      : state.items.find(function(x){ return x.id===id; });
  }
  function editRow(src, id){ editingRow = { src:src, id:id }; renderLectures(); }
  function saveRow(btn){
    var wrap = btn.closest('.tl'); if(!wrap) return;
    var title = wrap.querySelector('.edTitle').value.trim();
    var date = wrap.querySelector('.edDate').value;
    var newKind = wrap.querySelector('.edKind').value;
    var src = btn.getAttribute('data-src'), id = btn.getAttribute('data-id');
    var rec = findRow(src, id);
    if(!rec || !title){ editingRow=null; renderLectures(); return; }
    var cls = src==='lecture' ? rec.cls : rec.subject; // class carries over on a type change
    if(newKind==='lecture'){
      if(src==='lecture'){ rec.title=title; rec.date=date; }
      else { // Task → lecture: move between arrays
        state.items = state.items.filter(function(x){ return x.id!==id; });
        state.lectures.push({ id:uid(), cls:cls, title:title, date:date });
      }
    } else {
      var type = newKind.charAt(0).toUpperCase()+newKind.slice(1); // Quiz / Exam / Assignment
      if(src==='item'){ rec.title=title; rec.due=date; rec.type=type; }
      else { // lecture → Task: move between arrays
        state.lectures = state.lectures.filter(function(x){ return x.id!==id; });
        state.items.push({ id:uid(), title:title, subject:cls, type:type, due:date, done:false, createdAt:Date.now() });
      }
    }
    editingRow = null; persist(); refreshClasses(); renderLectures();
  }

  // ============ IMPORT SYLLABUS ============
  function setImgLoading(on, msg){ $('importLoading').hidden = !on; if(msg) $('loadMsg').textContent = msg; }

  // Downscale a File to a JPEG data URL (keeps syllabus text legible, caps size).
  function fileToDataUrl(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        try {
          var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, max/Math.max(w,h));
          var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
          var cv = document.createElement('canvas'); cv.width=cw; cv.height=ch;
          cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL('image/jpeg', 0.9));
        } catch(e){ URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('bad_image')); };
      img.src = url;
    });
  }

  async function handleFiles(files){
    if(!files || !files.length) return;
    if(!window.Vitality || !window.Vitality.importSyllabus){ alert('Import needs the dashboard host.'); return; }
    setImgLoading(true, files.length>1 ? 'Reading '+files.length+' pages…' : 'Reading your syllabus…');
    try {
      var imgs = [];
      for(var i=0;i<files.length && i<8;i++){ imgs.push(await fileToDataUrl(files[i])); }
      var res = await window.Vitality.importSyllabus(imgs);
      setImgLoading(false);
      if(!res || !res.ok){ showReviewError(res && res.error); return; }
      openReview(res.syllabus);
    } catch(e){ setImgLoading(false); showReviewError('bad_image'); }
  }

  var ERRS = { no_key:'AI key isn’t set up on the server yet.', too_large:'That image is too large — try a tighter screenshot.', rate_limited:'Too many requests just now — try again in a minute.', timeout:'That took too long — try one page at a time.', network:'Network problem — check your connection.', bad_image:'Couldn’t read that image.' };
  function showReviewError(code){
    pendingImport = null;
    $('revTitle').textContent = 'Import failed';
    $('revSub').textContent = '';
    $('revBody').innerHTML = '<div class="errNote">'+esc(ERRS[code]||'Something went wrong reading the syllabus.')+'</div>';
    $('revConfirm').hidden = true; $('revCancel').textContent = 'Close';
    $('reviewModal').hidden = false;
  }

  function openReview(syl){
    pendingImport = syl;
    var nL=syl.lectures.length, nQ=syl.quizzes.length, nE=syl.exams.length, nA=syl.assignments.length;
    $('revTitle').textContent = syl.className || 'Class';

    syl.lectures.forEach(function(x){ rows.push([x.date,x.title,'lecture']); });
    syl.quizzes.forEach(function(x){ rows.push([x.date,x.title,'quiz']); });
    syl.exams.forEach(function(x){ rows.push([x.date,x.title,'exam']); });
    syl.assignments.forEach(function(x){ rows.push([x.date,x.title,'assignment']); });
    rows.sort(function(a,b){ return (a[0]||'').localeCompare(b[0]||''); });
    $('revBody').innerHTML = rows.length
      ? rows.map(function(r){ return '<div class="revRow"><span class="tlDate">'+esc(fmtDate(r[0]))+'</span><span class="tlTitle">'+esc(r[1])+'</span><span class="kind '+r[2]+'">'+r[2]+'</span></div>'; }).join('')
      : '<div class="errNote">No dated items found. Try a clearer screenshot.</div>';

    $('revCancel').textContent = 'Cancel';

  function confirmImport(){
    var syl = pendingImport; $('reviewModal').hidden = true; pendingImport = null;
    if(!syl) return;
    var cls = syl.className || 'Class';
    // dedup helpers
    var lkey = {}; state.lectures.forEach(function(l){ lkey[l.cls+'|'+l.date+'|'+l.title]=1; });
    syl.lectures.forEach(function(x){
      var k=cls+'|'+x.date+'|'+x.title; if(lkey[k]) return; lkey[k]=1;
      state.lectures.push({ id:uid(), cls:cls, title:x.title, date:x.date });
    });
    var ikey = {}; state.items.forEach(function(it){ ikey[(it.subject||'')+'|'+(it.type||'')+'|'+it.title+'|'+(it.due||'')]=1; });
    function addTasks(list, type){ list.forEach(function(x){
      var k=cls+'|'+type+'|'+x.title+'|'+x.date; if(ikey[k]) return; ikey[k]=1;
      state.items.push({ id:uid(), title:x.title, subject:cls, type:type, due:x.date, done:false, createdAt:Date.now() });
    }); }
    addTasks(syl.quizzes,'Quiz'); addTasks(syl.exams,'Exam'); addTasks(syl.assignments,'Assignment');
    persist(); refreshClasses();
    setTab('lectures');

  document.addEventListener('click', function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;

    if(act==='toggle') toggleTask(id);
    else if(act==='del') delTask(id);

  (async function(){

      if(saved && typeof saved==='object' && !Array.isArray(saved)) state = saved;

    } catch(e){}
    if(!state.items) state.items=[]; if(!state.classes) state.classes=[]; if(!state.grades) state.grades=[]; if(!state.lectures) state.lectures=[]; if(!state.meetings) state.meetings=[];

        ['Endocrine & Reproduction Pharmacotherapy',[2,4,5],'08:30','10:40','PH-130 · Busch'],

        ['Pharmacy Outcomes',[2],'12:45','14:35','PH-131 · Busch'],
        ['Gerontology',[2],'15:10','17:00','PH-288 · Busch']
      ];
      SEED_MEETINGS.forEach(function(m){ state.meetings.push({ id:uid(), name:m[0], days:m[1], start:m[2], end:m[3], room:m[4] }); });
      state.seededSchedule = true; persist();
    }
    refreshClasses(); renderTasks();
  })();
})();
